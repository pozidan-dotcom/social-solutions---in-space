const f1 = n => n.toFixed(1);

function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ---------- stars ---------- */
(function stars() {
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
  let lastW = 0;
  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
    lastW = w;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = rng(7), n = Math.round(w * h / 4200), tints = ['#ffffff', '#d9d0ff', '#ffd0ea', '#c8f6ff'];
    for (let i = 0; i < n; i++) {
      ctx.globalAlpha = .25 + r() * .6;
      ctx.fillStyle = tints[Math.floor(r() * tints.length)];
      ctx.beginPath(); ctx.arc(r() * w, r() * h, r() < .93 ? .5 + r() * .4 : 1.1, 0, 6.2832); ctx.fill();
    }
  }
  let t; addEventListener('resize', () => { if (innerWidth !== lastW) { clearTimeout(t); t = setTimeout(draw, 150); } });
  draw();
})();

/* ---------- orbital megacity skyline (hero) ---------- */
(function city() {
  const el = document.getElementById('city'), r = rng(2077), W = 1400, H = 300;
  const neon = ['#19E3FF', '#FF2E93', '#F2E94E'];
  let x = -10, s = '';
  while (x < W) {
    const w = 26 + r() * 60, h = 60 + r() * r() * 190 + 20, y = H - h;
    s += `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="url(#bld)"/>`;
    if (r() < .4) s += `<rect x="${f1(x + w * .3)}" y="${f1(y - 16)}" width="${f1(w * .4)}" height="16" fill="#0F0B24"/>`;
    if (r() < .35) { const ah = 28 + r() * 34; s += `<path d="M${f1(x + w / 2)} ${f1(y)}V${f1(y - ah)}" stroke="#2A2150" stroke-width="2"/><circle cx="${f1(x + w / 2)}" cy="${f1(y - ah)}" r="2.2" fill="#FF2E4D"/>`; }
    for (let wy = y + 8; wy < H - 6; wy += 9)
      for (let wx = x + 5; wx < x + w - 5; wx += 8)
        if (r() < .2) s += `<rect x="${f1(wx)}" y="${f1(wy)}" width="3" height="4" fill="${neon[Math.floor(r() * 3)]}" opacity="${(.35 + r() * .6).toFixed(2)}"/>`;
    x += w + r() * 6;
  }
  const signs =
    `<g class="flick" filter="url(#cityNeon)"><rect x="236" y="96" width="9" height="96" rx="2" fill="#FF2E93"/><rect x="252" y="120" width="5" height="44" rx="2" fill="#FF2E93"/></g>` +
    `<g filter="url(#cityNeon)"><rect x="560" y="150" width="86" height="6" rx="3" fill="#F2E94E" opacity=".9"/></g>` +
    `<g class="flick2"><rect x="1176" y="84" width="74" height="46" rx="4" fill="#0B0818" stroke="#FF2E4D" stroke-width="2"/>` +
    `<ellipse cx="1213" cy="107" rx="22" ry="10" fill="none" stroke="#FF2E4D" stroke-width="2" filter="url(#cityNeon)"/><circle cx="1213" cy="107" r="6" fill="#FF2E4D" filter="url(#cityNeon)"/></g>`;
  const beams =
    `<path d="M330 300L270 -60L350 -60Z" fill="url(#beam)"/><path d="M940 300L1010 -60L1090 -60Z" fill="url(#beam)"/>`;
  el.innerHTML =
    `<defs><linearGradient id="bld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241852"/><stop offset="1" stop-color="#0A0718"/></linearGradient>` +
    `<linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#19E3FF" stop-opacity=".22"/><stop offset="1" stop-color="#19E3FF" stop-opacity="0"/></linearGradient>` +
    `<filter id="cityNeon" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1600" height="500"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>` +
    beams + s + signs;
})();

/* ---------- planets ---------- */
const PALETTE = ['#F2E94E', '#A66BFF', '#7CFF6B', '#FF7A2E', '#4D7CFF', '#2EFFC1', '#FF4D4D', '#FFC14D'];
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

function planet(i, R, id, num = i + 1) {
  const col = PALETTE[i % PALETTE.length], kind = i % 4, rnd = rng(i * 131 + 7);
  const defs =
    `<radialGradient id="${id}g" cx=".3" cy=".26" r=".95"><stop offset="0" stop-color="${mix(col, '#07060F', .6)}"/><stop offset=".55" stop-color="${mix(col, '#07060F', .86)}"/><stop offset="1" stop-color="#06050D"/></radialGradient>` +
    `<clipPath id="${id}c"><circle r="${R}"/></clipPath>`;
  let back = '', front = '', surf = '';

  if (kind === 0) {            // city lights on the night side
    for (let k = 0; k < 40; k++) {
      const a = rnd() * 6.283, rr = Math.sqrt(rnd()) * R * .92, x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      if (x + y < -R * .25) continue;
      surf += `<rect x="${f1(x)}" y="${f1(y)}" width="${(1.4 + rnd() * 1.8).toFixed(1)}" height="1.6" fill="${rnd() < .25 ? '#fff' : col}" opacity="${(.45 + rnd() * .5).toFixed(2)}"/>`;
    }
  }
  if (kind === 1) {            // neon ring
    const rx = R * 1.75, ry = R * .44;
    back = `<ellipse rx="${rx}" ry="${ry}" fill="none" stroke="${col}" stroke-width="3" opacity=".7" transform="rotate(-16)" filter="url(#neon)"/>`;
    front = `<path d="M${-rx} 0A${rx} ${ry} 0 0 0 ${rx} 0" fill="none" stroke="${col}" stroke-width="3.4" transform="rotate(-16)" filter="url(#neon)"/>`;
  }
  if (kind === 2) {            // gas giant bands
    surf = `<g fill="#000" opacity=".28"><rect x="${-R}" y="${-R * .5}" width="${2 * R}" height="${R * .2}"/><rect x="${-R}" y="${R * .1}" width="${2 * R}" height="${R * .14}"/><rect x="${-R}" y="${R * .5}" width="${2 * R}" height="${R * .12}"/></g>` +
      `<g fill="none" stroke="${col}" stroke-opacity=".4" stroke-width="1.6"><path d="M${-R} ${-R * .4}Q0 ${-R * .56} ${R} ${-R * .4}"/><path d="M${-R} ${R * .02}Q0 ${-R * .14} ${R} ${R * .02}"/><path d="M${-R} ${R * .42}Q0 ${R * .28} ${R} ${R * .42}"/></g>`;
  }
  if (kind === 3) {            // fractured world, glowing cracks
    surf = `<path d="M${-R * .55} ${-R * .25}L${-R * .25} ${-R * .02}L${-R * .1} ${R * .25}L${R * .2} ${R * .38}M${-R * .25} ${-R * .02}L${-R * .4} ${R * .3}M${R * .05} ${-R * .5}L${-R * .1} ${-R * .2}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>`;
  }

  const shapes =
    `<circle r="${R + 16}" fill="${col}" opacity=".07"/>${back}` +
    `<circle r="${R}" fill="url(#${id}g)"/>` +
    `<g clip-path="url(#${id}c)">${surf}<rect x="${-R}" y="${-R}" width="${2 * R}" height="${2 * R}" fill="url(#scan)"/></g>` +
    `<circle r="${R}" fill="none" stroke="${col}" stroke-opacity=".45" stroke-width="1.6"/>` +
    `<circle r="${R}" fill="none" stroke="${col}" stroke-width="3.5" pathLength="100" stroke-dasharray="38 62" transform="rotate(157)" filter="url(#neon)"/>` +
    `${front}${critters(i, R)}` +
    `<text class="num" text-anchor="middle" y="${R * .4}" font-size="${R * 1.2 * (String(num).length > 2 ? .78 : 1)}">${esc(num)}</text>`;
  return { defs, shapes };
}

/* ---------- characters on the planets: runners, creatures, drones ---------- */
const BODY = '#15112B';
const SUITS = ['#19E3FF', '#F2E94E', '#FF2E93'];
const grp = rim => `fill="${BODY}" stroke="${rim}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"`;
const tube = (d, rim) => `<path d="${d}" fill="none" stroke="${rim}" stroke-width="8"/><path d="${d}" fill="none" stroke="${BODY}" stroke-width="4.6"/>`;
const glowEye = (x, y, r, c) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="none" filter="url(#neon)"/>`;

function cadet(rim) {
  return `<g ${grp(rim)}>` +
    `<path d="M-12 -34V-46" fill="none"/><circle cx="-12" cy="-47" r="1.8" fill="${rim}" stroke="none" filter="url(#neon)"/>` +
    `<rect x="-15" y="-34" width="7" height="16" rx="2"/>` +
    `<path d="M-9 -34L-14 -3L-17 0H10L9 -34Z"/>` +
    `<path d="M4 -31L16 -28" fill="none" stroke="${rim}" stroke-width="7"/><path d="M4 -31L16 -28" fill="none" stroke="${BODY}" stroke-width="4.4"/>` +
    `<path d="M12 -32H36L41 -28.5H36V-25H14Z"/>` +
    `<path d="M22 -29H38" fill="none" stroke="${rim}" stroke-width="1.8" filter="url(#neon)"/>` +
    `<circle cy="-43" r="9.5"/>` +
    `<path d="M-2 -44H8" fill="none" stroke="#19E3FF" stroke-width="3.4" filter="url(#neon)"/></g>`;
}

const MONSTERS = {
  m1: () => `<g ${grp('#FF2E93')}>` +
    tube('M-18 -22Q-34 -12 -29 0', '#FF2E93') + tube('M18 -22Q34 -12 29 0', '#FF2E93') +
    `<path d="M-18 0L-20 -24Q-18 -44 0 -46Q18 -44 20 -24L18 0Z"/>` +
    `<path d="M-14 -38L-23 -54L-8 -44ZM0 -46L1 -62L7 -46ZM13 -42L23 -55L17 -38Z"/>` +
    `<ellipse cy="-28" rx="10" ry="8" fill="#FF2E93" stroke="none" filter="url(#neon)"/>` +
    `<rect x="-1.4" y="-35" width="2.8" height="14" rx="1.4" fill="#07060F" stroke="none"/></g>`,
  m2: () => `<g ${grp('#F2E94E')}>` +
    `<path d="M-14 -34L-18 -50L-8 -40ZM-4 -38L-4 -56L4 -38ZM8 -38L16 -52L14 -34Z"/>` +
    `<path d="M-21 0L-19 -22Q-15 -40 4 -38Q19 -36 21 -18L19 0Z"/>` +
    glowEye(-9, -28, 3.6, '#F2E94E') + glowEye(0, -31, 4, '#F2E94E') + glowEye(9, -28, 3.6, '#F2E94E') +
    `<path d="M-13 -15H13" fill="none"/><path d="M-11 -15L-9 -8L-7 -15M-5 -15L-3 -8L-1 -15M1 -15L3 -8L5 -15M7 -15L9 -8L11 -15" fill="#EDE9FF" stroke="none"/></g>`,
  m3: () => `<g ${grp('#19E3FF')}>` +
    tube('M-14 -16Q-23 -8 -14 0', '#19E3FF') + tube('M-5 -16Q-10 -8 -3 0', '#19E3FF') + tube('M5 -16Q10 -8 3 0', '#19E3FF') + tube('M14 -16Q23 -8 14 0', '#19E3FF') +
    `<path d="M-19 -16Q-19 -48 0 -48Q19 -48 19 -16Z"/>` +
    glowEye(-7, -32, 4.4, '#19E3FF') + glowEye(7, -32, 4.4, '#19E3FF') + glowEye(0, -22, 2.6, '#19E3FF') + `</g>`,
  m4: () => `<g transform="translate(0 -8)" ${grp('#FF2E4D')}>` +
    `<path d="M-6 -27L-26 8H26L6 -27Z" fill="#FF2E4D" fill-opacity=".14" stroke="none"/>` +
    `<path d="M0 -48V-60" fill="none"/><circle cy="-61" r="2" fill="#FF2E4D" stroke="none" filter="url(#neon)"/>` +
    `<path d="M-26 -42H-16M16 -42H26" fill="none" stroke="#9A8FB8" stroke-width="2.6"/>` +
    `<circle cy="-34" r="15"/><circle cy="-34" r="9" fill="#07060F" stroke="${'#FF2E4D'}" stroke-width="1.4"/>` +
    glowEye(0, -34, 5.5, '#FF2E4D') + `</g>`
};

/* מי גר על כל כוכב (לפי מספר השיעור; חוזר מחדש אם יש יותר שיעורים) */
const CRITTER_PLAN = [
  [{ k: 'cadet', a: -125, s: 0 }],
  [{ k: 'm1', a: -58 }],
  [{ k: 'ship' }],
  [{ k: 'cadet', a: -62, s: 1 }],
  [{ k: 'cadet', a: -110, s: 2 }],
  [{ k: 'm3', a: -50 }, { k: 'cadet', a: -128, s: 2 }],
  [{ k: 'm4', a: -66 }],
  [{ k: 'm2', a: -112 }],
  [{ k: 'patrol' }],
  [{ k: 'cadet', a: -112, s: 0 }],
  [{ k: 'm1', a: -70, sc: 1.35 }, { k: 'cadet', a: -150, s: 1 }]
];

function critters(i, R) {
  return CRITTER_PLAN[i % CRITTER_PLAN.length].map(c => {
    if (c.k === 'ship') return `<use href="#ship-fighter" x="${f1(R * 1.05)}" y="${f1(-R * 1.3)}" width="58" height="23"/>`;
    if (c.k === 'patrol') return `<use href="#ship-drone" x="${f1(R)}" y="${f1(-R * 1.6)}" width="44" height="44"/>`;
    const rad = c.a * Math.PI / 180, sc = (c.sc || .8) * Math.sqrt(R / 46);
    const body = c.k === 'cadet' ? cadet(SUITS[(c.s || 0) % 3]) : MONSTERS[c.k]();
    return `<g transform="translate(${f1(R * Math.cos(rad))} ${f1(R * Math.sin(rad))}) rotate(${c.a + 90}) translate(0 3) scale(${sc})">${body}</g>`;
  }).join('');
}

function wrap(t, max = 16) {
  const words = t.split(/\s+/).filter(Boolean), lines = [];
  let cur = '';
  for (const w of words) {
    if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
  }
  if (cur) lines.push(cur);
  if (lines.length > 3) { lines.length = 3; lines[2] += '…'; }
  return lines;
}

function smooth(p) {
  let d = `M${p[0][0]} ${p[0][1]}`;
  for (let k = 0; k < p.length - 1; k++) {
    const p0 = p[k - 1] || p[k], p1 = p[k], p2 = p[k + 1], p3 = p[k + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d;
}

/* ---------- build the sector map ---------- */
const mapEl = document.getElementById('map');
(function buildMap() {
  const COLS = 4, W = 1400, R = 46, ROW = 330;
  const rows = Math.ceil(LESSONS.length / COLS), H = 140 + (rows - 1) * ROW + 230;
  const pts = [[1255, 164]];
  let defs = '', planets = '';

  LESSONS.forEach((L, i) => {
    const r = Math.floor(i / COLS), c = i % COLS, slot = r % 2 === 0 ? COLS - 1 - c : c;
    const R = L.small ? 30 : 46;
    const x = 160 + slot * 320, y = 140 + r * ROW + (c % 2 ? 56 : 0);
    pts.push([x, y]);
    if (c === COLS - 1 && i < LESSONS.length - 1) pts.push([r % 2 === 0 ? 44 : W - 44, (y + 140 + (r + 1) * ROW) / 2]);

    const p = planet(L.look ?? i, R, 'p' + i, L.num ?? i + 1);
    defs += p.defs;
    const lines = wrap(L.title || 'שם השיעור');
    const label = lines.map((t, k) => `<tspan x="0" dy="${k ? 36 : 0}">${esc(t)}</tspan>`).join('');
    planets +=
      `<g class="planet" transform="translate(${x} ${y})" tabindex="0" role="button" data-i="${i}" style="--i:${i}" aria-label="${esc(lessonName(L, i))}">` +
      `<g class="pop">${p.shapes}<circle class="focus" r="${R + 12}"/></g>` +
      `<text class="lbl${L.title ? '' : ' ph'}" text-anchor="middle" y="${R + 48}" font-size="36">${label}</text></g>`;
  });

  const d = smooth(pts);

  /* מטוס קרב בתחילת המסלול + כלי טיס שמסתובבים בין השורות */
  let fleet = `<use href="#ship-fighter" x="1250" y="138" width="130" height="52"/>`;
  const decor = [['drone', 46], ['fighter', 92], ['fighter', 80, true]], decorX = [320, 640, 960];
  for (let r = 0; r < rows - 1; r++) {
    const gy = 140 + r * ROW + 232;
    decorX.forEach((dx, k) => {
      const [kind, w, flip] = decor[(k + r) % decor.length];
      const h = kind === 'drone' ? w : w * .4;
      fleet += `<g transform="translate(${dx} ${gy})${flip ? ' scale(-1 1)' : ''}"><use href="#ship-${kind}" x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}"/></g>`;
    });
  }

  const frame =
    `<rect x="2" y="2" width="${W - 4}" height="${H - 4}" fill="url(#grid)"/>` +
    `<path class="hud" d="M2 44V2H44M${W - 44} 2H${W - 2}V44M2 ${H - 44}V${H - 2}H44M${W - 44} ${H - 2}H${W - 2}V${H - 44}"/>`;

  mapEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  mapEl.innerHTML =
    `<defs>${defs}` +
    `<pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#19E3FF" stroke-opacity=".08" stroke-width="1"/></pattern>` +
    `<mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">` +
    `<path class="draw" d="${d}" pathLength="1" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/></mask></defs>` +
    `${frame}<g mask="url(#reveal)"><path class="trail-glow" d="${d}"/><path class="trail" d="${d}"/></g>${fleet}${planets}`;
})();

/* ---------- lesson panel & activity stage ---------- */
const $ = id => document.getElementById(id);
const app = $('app'), lessonOverlay = $('lessonOverlay'), stageOverlay = $('stageOverlay'), stageBody = $('stageBody');
let curLesson = null, lessonOpener = null, tileOpener = null;

const isPlaceholder = a => !(a.type === 'digital' ? (a.render || a.url) : a.type === 'slides' ? a.url : a.html);

function tileHTML(a, j) {
  const aud = AUD[a.audience];
  const tag = aud ? `<span class="tag ${aud.cls}">${aud.tag}</span>` : '';
  const inner = `<span class="tile-t">${esc(a.title)}${tag}</span><span class="tile-d">${esc(a.desc || '')}</span>`;
  if (a.url) return `<a class="tile ${a.type}" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
  if (isPlaceholder(a)) return `<button class="tile ${a.type} is-ph" disabled>${inner}</button>`;   // nothing to open yet
  return `<button class="tile ${a.type}" data-j="${j}">${inner}</button>`;
}

function openLesson(i, opener) {
  const L = LESSONS[i];
  curLesson = i; lessonOpener = opener;
  const p = planet(L.look ?? i, 46, 'm' + i, L.num ?? i + 1);
  $('lessonPlanet').innerHTML = `<defs>${p.defs}</defs>${p.shapes}`;
  const h = $('lessonTitle');
  h.textContent = L.title || 'שם השיעור';
  h.className = L.title ? '' : 'ph';
  h.setAttribute('aria-label', lessonName(L, i));
  $('lessonBlurb').textContent = L.blurb || '';

  const acts = L.activities.map((a, j) => [a, j]);
  let shown = 0;
  const fill = (id, type) => {            // a rubric is shown only when it holds real content; it returns by itself once one is added
    const list = acts.filter(([a]) => a.type === type && !isPlaceholder(a));
    $(id).innerHTML = list.map(([a, j]) => tileHTML(a, j)).join('');
    $(id).parentElement.hidden = !list.length;
    if (list.length) shown++;
  };
  fill('digitalTiles', 'digital');
  fill('printTiles', 'print');
  fill('slideTiles', 'slides');
  const cols = document.querySelector('#lessonOverlay .cols');
  cols.style.setProperty('--n', Math.max(shown, 1)); cols.dataset.n = shown; cols.hidden = !shown;
  $('noContent').hidden = shown > 0;

  lessonOverlay.hidden = false;
  app.inert = true;
  document.body.style.overflow = 'hidden';
  $('lessonClose').focus();
}

function closeLesson() {
  lessonOverlay.hidden = true;
  app.inert = false;
  document.body.style.overflow = '';
  if (lessonOpener) lessonOpener.focus();
}

function openActivity(j, opener) {
  const L = LESSONS[curLesson], a = L.activities[j];
  tileOpener = opener;
  $('stageTitle').textContent = a.title;
  $('printBtn').hidden = !(a.type === 'print' && a.html);
  $('stageLogo').toggleAttribute('hidden', !(a.type === 'digital' && a.render));   // the logo appears only on the game screen (SVG has no .hidden property)
  stageBody.replaceChildren();

  if (a.type === 'digital') {
    if (a.render) {
      a.render(stageBody, { lesson: L, index: curLesson });
    } else {
      stageBody.innerHTML = `<div class="slot"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>כאן תיכנס הפעילות</div>`;
    }
  } else {
    const aud = AUD[a.audience];
    const body = a.html || `<div class="paper-slot">כאן יופיע תוכן הדף</div>`;
    stageBody.innerHTML =
      `<article class="paper">${aud && aud.banner ? `<p class="tnote">${aud.banner}</p>` : (aud && !aud.fields ? '' : FIELDS_ROW)}` +
      `<h1>${esc(a.title)}</h1><p class="paper-sub">${esc(lessonName(L, curLesson))}</p>` +
      `<div class="paper-body">${body}</div><footer>חשיבה חברתית – תהיה הקברניט של המוח שלך</footer></article>`;
  }
  stageOverlay.hidden = false;
  lessonOverlay.inert = true;
  $('stageBack').focus();
}

function closeActivity() {
  stageOverlay.hidden = true;
  stageBody.replaceChildren();
  lessonOverlay.inert = false;
  if (tileOpener) tileOpener.focus();
}

mapEl.addEventListener('click', e => {
  const p = e.target.closest('.planet');
  if (p) openLesson(+p.dataset.i, p);
});
mapEl.addEventListener('keydown', e => {
  const p = e.target.closest && e.target.closest('.planet');
  if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openLesson(+p.dataset.i, p); }
});
lessonOverlay.addEventListener('click', e => {
  if (e.target === lessonOverlay) closeLesson();
  const t = e.target.closest('.tile');
  if (t && t.dataset.j !== undefined) openActivity(+t.dataset.j, t);
});
$('lessonClose').addEventListener('click', closeLesson);
$('stageBack').addEventListener('click', closeActivity);
$('printBtn').addEventListener('click', () => { try { window.print(); } catch (err) { console.error(err); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!stageOverlay.hidden) closeActivity();
  else if (!lessonOverlay.hidden) closeLesson();
});
</script>
</body>
</html>
