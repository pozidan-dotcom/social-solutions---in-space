<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="חשיבה חברתית – תהיה הקברניט של המוח שלך: מפת שיעורים עם מצגות, פעילויות ודפים להדפסה, מאת עידן שפוד.">
<meta name="theme-color" content="#07060F">
<meta name="robots" content="noindex, nofollow">   <!-- למחוק את השורה הזאת אם רוצים שהעמוד יופיע בחיפוש בגוגל -->
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="חשיבה חברתית – תהיה הקברניט של המוח שלך">
<meta property="og:description" content="חשיבה חברתית – תהיה הקברניט של המוח שלך: מפת שיעורים עם מצגות, פעילויות ודפים להדפסה, מאת עידן שפוד.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<title>חשיבה חברתית – תהיה הקברניט של המוח שלך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;

    --void: #07060F;
    --haze: #160F2E;
    --panel: #0D0A21;
    --hull: #EDE9FF;
    --dim: #9A8FB8;
    --line: rgba(154, 143, 184, .32);
    --cyan: #19E3FF;
    --magenta: #FF2E93;
    --yellow: #F2E94E;
    --red: #FF2E4D;

    --font-title: 'Rubik Glitch', 'Heebo', Arial, sans-serif;
    --font-display: 'Karantina', 'Heebo', Arial, sans-serif;
    --font-body: 'Assistant', system-ui, 'Segoe UI', Arial, sans-serif;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--void);
    color: var(--hull);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.5;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- atmosphere ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 50% at 12% 6%, rgba(255, 46, 147, .20), transparent 70%),
      radial-gradient(55% 45% at 92% 70%, rgba(25, 227, 255, .12), transparent 70%),
      linear-gradient(var(--void), var(--haze) 75%, #0b0720);
  }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .scan {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0, 0, 0, .55)),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, .028) 0 1px, transparent 1px 3px);
  }
  .app { position: relative; z-index: 1; overflow-x: clip; }

  /* ---------- hero ---------- */
  .hero-wrap { position: relative; }
  #city {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; height: min(300px, 42vw);
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to top, #000 55%, transparent);
    mask-image: linear-gradient(to top, #000 55%, transparent);
  }
  .flick { animation: flick 6s steps(1) infinite; }
  .flick2 { animation: flick 9s steps(1) 2s infinite; }
  @keyframes flick { 0%, 17%, 21%, 58%, 62%, 100% { opacity: 1; } 19%, 60% { opacity: .2; } }

  .hero {
    position: relative;
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(40px, 9vh, 100px) 24px clamp(70px, 9vw, 120px);
  }
  .hero h1, .hero .sub, .legend { position: relative; z-index: 1; }
  .hero h1 {
    font-family: var(--font-title);
    font-weight: 900; font-synthesis: none;
    font-size: clamp(3.4rem, 11vw, 10rem);
    line-height: 1;
    color: #fff;
    text-shadow: 3px 0 0 rgba(255, 46, 147, .7), -3px 0 0 rgba(25, 227, 255, .7), 0 0 36px rgba(255, 46, 147, .35);
    animation: glitch 1.2s steps(1) .25s both;
  }
  @keyframes glitch {
    0% { transform: translate(0); } 8% { transform: translate(-9px, 2px) skewX(6deg); }
    16% { transform: translate(7px, -2px); } 24% { transform: translate(0); }
    36% { transform: translate(-5px, 0) skewX(-4deg); } 44% { transform: translate(0); } 100% { transform: translate(0); }
  }
  .hero-wrap > .mark {
    position: absolute; z-index: 2;
    top: clamp(12px, 2.2vw, 30px); left: clamp(12px, 3vw, 44px);
    height: clamp(96px, 10vw, 140px); width: auto; overflow: visible;
    filter: drop-shadow(0 0 10px rgba(255, 203, 31, .45));
  }
  .mark .lt { fill: var(--hull); }
  .mark .yl { fill: #FFCB1F; }
  .mark .dk { fill: #1A1530; }
  .hero .sub {
    margin: .3em 0 0;
    font-size: clamp(1.3rem, 3vw, 2.2rem);
    font-weight: 600;
  }

  .rings {
    position: absolute; left: -4%; top: -14%;
    width: min(62vw, 660px); height: auto;
    opacity: .5; pointer-events: none;
  }
  .rings circle { fill: none; stroke: var(--cyan); stroke-opacity: .35; stroke-width: 1.4; }
  .rings .dash { stroke-dasharray: 3 10; }
  .rings .dot { fill: var(--magenta); stroke: none; }

  .fleet {
    position: absolute; left: -4%; top: 28%;
    width: min(46vw, 560px); height: auto;
    pointer-events: none;
    filter: drop-shadow(0 0 20px rgba(25, 227, 255, .22));
  }
  .cruiser { animation: float 7s ease-in-out infinite alternate; }
  @keyframes float { to { transform: translateY(-10px); } }

  .legend {
    display: flex; flex-wrap: wrap; gap: 14px 32px;
    margin: 34px 0 0;
    font-size: 1.1rem; font-weight: 700;
  }
  .legend span { display: inline-flex; align-items: center; gap: 10px; }
  .badge {
    display: inline-grid; place-items: center;
    width: 36px; height: 36px; border-radius: 3px;
    border: 2px solid currentColor;
    background: rgba(7, 6, 15, .6);
    box-shadow: 0 0 14px -2px currentColor;
  }
  .badge svg, .tile-ico svg { width: 20px; height: 20px; }
  .badge.cyan { color: var(--cyan); }
  .badge.magenta { color: var(--magenta); }
  .badge.yellow { color: var(--yellow); }
  svg.ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .tape {
    height: 14px;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 16px, #0b0a14 16px 32px);
    box-shadow: 0 0 22px rgba(242, 233, 78, .22);
    transform: rotate(-.5deg) scaleX(1.03);
    opacity: .92;
  }

  /* ---------- sector map ---------- */
  .map-wrap { max-width: 1200px; margin: 0 auto; padding: 36px 16px 96px; }
  #map { display: block; width: 100%; height: auto; overflow: visible; }
  .hud { fill: none; stroke: var(--cyan); stroke-width: 3; opacity: .7; }

  .trail-glow { fill: none; stroke: var(--cyan); stroke-width: 14; stroke-linecap: round; opacity: .16; }
  .trail { fill: none; stroke: var(--cyan); stroke-width: 3; stroke-dasharray: 16 10; filter: drop-shadow(0 0 4px rgba(25, 227, 255, .9)); }
  .draw { stroke-dasharray: 1; animation: draw 2.4s ease-out .3s backwards; }
  @keyframes draw { from { stroke-dashoffset: 1; } }

  .planet { cursor: pointer; outline: none; }
  .planet .pop {
    transform-box: fill-box; transform-origin: center;
    transition: transform .2s ease;
    animation: arrive .6s cubic-bezier(.2, 1.3, .4, 1) backwards;
    animation-delay: calc(var(--i) * .16s + .45s);
  }
  .planet:hover .pop, .planet:focus-visible .pop { transform: scale(1.09); }
  .planet .focus { fill: none; stroke: var(--yellow); stroke-width: 4; stroke-dasharray: 10 8; opacity: 0; }
  .planet:focus-visible .focus { opacity: 1; }
  @keyframes arrive { from { opacity: 0; transform: scale(.4); } }

  .num {
    fill: #fff; font-family: var(--font-display); font-weight: 700;
    paint-order: stroke; stroke: rgba(7, 6, 15, .8); stroke-width: 4px; stroke-linejoin: round;
  }
  .lbl {
    fill: var(--hull); font-family: var(--font-display); font-weight: 700;
    paint-order: stroke; stroke: var(--void); stroke-width: 8px; stroke-linejoin: round;
    animation: fade .5s ease backwards; animation-delay: calc(var(--i) * .16s + .7s);
  }
  .lbl.ph { fill: var(--dim); }
  @keyframes fade { from { opacity: 0; } }

  /* ---------- overlays (lesson panel + activity stage) ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex;
    padding: 20px;
    overflow: auto;
    background: rgba(4, 3, 12, .78);
    backdrop-filter: blur(6px);
  }
  .overlay[hidden] { display: none !important; }

  /* chamfered neon frame */
  .frame {
    position: relative;
    background: linear-gradient(135deg, var(--cyan), var(--magenta));
    clip-path: polygon(26px 0, 100% 0, 100% calc(100% - 26px), calc(100% - 26px) 100%, 0 100%, 0 26px);
    animation: rise .25s ease;
  }
  .frame::before {
    content: ''; position: absolute; inset: 2px;
    background: repeating-linear-gradient(0deg, rgba(25, 227, 255, .04) 0 1px, transparent 1px 4px), var(--panel);
    clip-path: polygon(25px 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%, 0 25px);
  }
  .frame > * { position: relative; z-index: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }

  .lesson { width: min(1100px, 100%); margin: auto; padding: 30px 32px 34px; }
  .lesson-head { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; }
  .lesson-head #lessonPlanet { flex: none; width: 128px; height: 118px; overflow: visible; }
  .lesson-head .txt { flex: 1; min-width: 0; }
  .lesson-head h2 { font-size: clamp(2.4rem, 5vw, 3.8rem); line-height: 1; }
  .lesson-head h2.ph { color: var(--dim); }
  .lesson-head p { margin: .35em 0 0; color: var(--dim); font-size: 1.1rem; }
  #lessonBlurb:empty { display: none; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: .5em 1.15em;
    border-radius: 2px;
    border: 1.5px solid var(--cyan);
    background: rgba(25, 227, 255, .07);
    color: var(--cyan);
    font-weight: 700; cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  .btn:hover { background: rgba(25, 227, 255, .18); box-shadow: 0 0 18px -2px var(--cyan); }
  .btn.primary { background: var(--yellow); border-color: var(--yellow); color: #14110a; box-shadow: 0 0 18px -4px var(--yellow); }
  .btn.primary:hover { background: #fff36b; }
  .btn svg { width: 20px; height: 20px; }
  .btn.round { width: 46px; height: 46px; padding: 0; justify-content: center; }
  .btn:focus-visible, .tile:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

  .cols { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 22px; }
  .cols[data-n="1"] { max-width: 480px; margin-inline: auto; }
  .cols[data-n="2"] { max-width: 900px; margin-inline: auto; }
  .col h3 { display: flex; align-items: center; gap: 10px; font-size: 2.1rem; line-height: 1; margin-bottom: 14px; }
  .col.digital h3 { color: var(--cyan); text-shadow: 0 0 16px rgba(25, 227, 255, .55); }
  .col.paper-col h3 { color: var(--magenta); text-shadow: 0 0 16px rgba(255, 46, 147, .55); }
  .col.slides-col h3 { color: var(--yellow); text-shadow: 0 0 16px rgba(242, 233, 78, .5); }
  .tiles { display: grid; gap: 12px; }

  .tile {
    --c: var(--cyan);
    display: grid; gap: 4px; text-align: start;
    width: 100%;
    padding: 16px 20px;
    border-radius: 2px;
    border: 1px solid var(--line);
    border-inline-start: 6px solid var(--c);
    background: rgba(255, 255, 255, .035);
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  .tile.print { --c: var(--magenta); }
  .tile.slides { --c: var(--yellow); }
  a.tile { color: inherit; text-decoration: none; }
  .tile:disabled { cursor: default; }
  .tile:disabled:hover { background: transparent; box-shadow: none; border-color: var(--line); }
  .tile:hover { background: rgba(255, 255, 255, .08); box-shadow: 0 0 20px -6px var(--c); border-color: var(--c); }
  .tile-t { font-family: var(--font-display); font-size: 1.8rem; line-height: 1.05; }
  .tile-d { color: var(--dim); font-size: 1.02rem; }
  .tag { display: inline-block; margin-inline-start: .6em; padding: .2em .55em; vertical-align: middle;
    border: 1px solid currentColor; border-radius: 2px; font: 700 .78rem/1 var(--font-body); letter-spacing: 0; }
  .tag.t-teacher { color: #FF9A5B; } .tag.t-student { color: #7CFF6B; } .tag.t-mixed { color: var(--hull); }
  .tile.is-ph { border-style: dashed; border-inline-start-style: solid; background: transparent; }
  .tile.is-ph .tile-t { color: var(--dim); }
  .empty { padding: 18px 20px; border: 1.5px dashed var(--line); border-radius: 2px; color: var(--dim); }

  /* ---------- activity stage ---------- */
  .stage {
    display: flex; flex-direction: column;
    width: min(1280px, 100%);
    margin: auto;
    height: calc(100vh - 40px); height: calc(100dvh - 40px);
    min-height: 0;
  }
  .stage-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 26px;
    border-bottom: 1px solid var(--line);
  }
  .stage-logo { flex: none; height: 54px; width: auto; display: block; filter: drop-shadow(0 0 6px rgba(255, 203, 31, .35)); }
  .stage-logo .lt { fill: var(--hull); } .stage-logo .yl { fill: #FFCB1F; } .stage-logo .dk { fill: #1A1530; }
  .stage-bar h2 { flex: 1; font-size: clamp(1.9rem, 3.4vw, 2.7rem); line-height: 1; }
  .stage-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 24px; overflow: auto; }
  .slot {
    flex: 1; display: grid; place-items: center; align-content: center; gap: 12px;
    min-height: 46vh; padding: 32px; text-align: center;
    border: 2px dashed var(--line); border-radius: 2px;
    color: var(--dim); font-size: 1.5rem;
  }
  .slot svg { width: 56px; height: 56px; color: var(--cyan); }

  /* printable sheet (A4 look on screen) */
  .paper {
    width: min(794px, 100%); margin: 0 auto; flex: none;
    min-height: 1123px;
    padding: 56px 64px 40px;
    display: flex; flex-direction: column; gap: 18px;
    background: #fff; color: #14172b;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(25, 227, 255, .5), 0 20px 60px rgba(0, 0, 0, .6);
  }
  .paper-meta { display: flex; gap: 28px; font-weight: 700; }
  .paper-meta span { display: flex; align-items: flex-end; gap: 8px; }
  .paper-meta span:first-child { flex: 2; }
  .paper-meta span:not(:first-child) { flex: 1; }
  .paper-meta i { flex: 1; border-bottom: 1.5px solid #14172b; height: 1.2em; }
  .paper h1 { font-family: var(--font-display); font-weight: 700; font-size: 3rem; line-height: 1; margin-top: 12px; }
  .paper-sub { margin: -10px 0 0; color: #5b6180; font-weight: 600; }
  .paper-body { flex: 1; display: block; font-size: 1.04rem; line-height: 1.6; }
  .paper-body p { margin: 0 0 .75em; }
  .paper-body ul, .paper-body ol { margin: 0 0 1em; padding-inline-start: 1.5em; }
  .paper-body li { margin-bottom: .4em; }
  .paper-body li > ul, .paper-body li > ol { margin: .4em 0 .2em; }
  .paper-body .lead { color: #5b6180; font-weight: 700; font-size: 1.1rem; }
  .paper .tnote { color: #b3261e; font-weight: 700; border: 1.5px solid #b3261e; padding: .4em .8em; border-radius: 2px; }
  .paper-body .pb { border-top: 2px dashed #b9bdd3; margin: 28px 0 22px; }
  .paper-body .land { border-top: 2px dashed #b9bdd3; margin-top: 28px; padding-top: 22px; }
  .paper-body .land img { display: block; width: 100%; height: auto; }
  .paper-slot {
    flex: 1; display: grid; place-items: center; min-height: 520px;
    border: 2px dashed #b9bdd3; border-radius: 2px;
    color: #8a90ad; font-size: 1.3rem; text-align: center;
  }
  .paper footer { font-size: .85rem; color: #8a90ad; text-align: center; }

  /* ---------- small screens & motion ---------- */
  @media (max-width: 760px) {
    .cols { grid-template-columns: 1fr; }
    .lesson { padding: 24px 18px 28px; }
    .lesson-head #lessonPlanet { width: 88px; height: 81px; }
    .stage-bar { flex-wrap: wrap; padding: 12px 14px; }
    .stage-bar h2 { order: 3; flex: 1 1 100%; }
    #printBtn { margin-inline-start: auto; }
    .stage-logo { height: 42px; }
    .stage-body { padding: 14px; }
    .paper-meta { flex-wrap: wrap; gap: 14px 20px; }
    .paper-meta span:first-child { flex: 1 1 100%; }
    .paper { padding: 32px 26px; min-height: 0; }
    .rings { opacity: .25; }
    .fleet { width: 92vw; left: 4%; top: -2%; opacity: .4; }
  }
  @media (prefers-reduced-motion: reduce) {
    .draw, .planet .pop, .lbl, .frame, .cruiser, .flick, .flick2, .hero h1 { animation: none; }
    .planet .pop, .btn, .tile { transition: none; }
  }

  /* ---------- print: only the open sheet, on white A4 ---------- */
  @page { size: A4; margin: 14mm 16mm; }
  @page landscape { size: A4 landscape; margin: 10mm; }
  @media print {
    html, body { background: #fff !important; }
    .backdrop, #stars, .scan, .app, #lessonOverlay, .stage-bar, .frame::before { display: none !important; }
    .overlay { position: static; display: block; padding: 0; background: none; backdrop-filter: none; overflow: visible; }
    .frame { background: none; clip-path: none; animation: none; }
    .stage { display: block; width: auto; height: auto; min-height: 0; margin: 0; }
    .stage-body { display: block; padding: 0; overflow: visible; }
    .paper { display: block; width: auto; height: auto; min-height: 0; padding: 0; border-radius: 0; box-shadow: none; }
    .paper > * + * { margin-top: 12pt; }
    .paper-body { font-size: 11.5pt; }
    .paper > .tnote { margin-bottom: 0; padding: 3pt 8pt; font-size: 10.5pt; }
    .paper > .tnote + h1 { margin-top: 6pt; }
    .paper h1 { font-size: 26pt; }
    .paper-body .pb { break-before: page; border: 0; margin: 0; padding: 0; height: 0; }
    .paper-body .land { page: landscape; border: 0; margin: 0; padding: 0; }
    .paper-body .land img { width: 100%; max-height: 188mm; object-fit: contain; }
    .paper:has(.land) footer { display: none; }
    .paper-body li, .paper-body p { break-inside: avoid; }
    .paper-body .kit { break-inside: avoid; }
  }
</style>
</head>
<body>
<noscript><p style="margin:0;padding:48px 24px;text-align:center;color:#EDE9FF;font:700 20px/1.6 Arial,sans-serif;background:#07060F">העמוד דורש JavaScript כדי להציג את המפה, הפעילויות ודפי ההדפסה. אפשר להפעיל אותו בהגדרות הדפדפן.</p></noscript>
<div class="backdrop"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<!-- ספריית כלי החלל (משמשת בעמוד הפתיחה ובמפה) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="hullG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A76A6"/><stop offset=".5" stop-color="#2E2A4D"/><stop offset="1" stop-color="#121026"/></linearGradient>
    <linearGradient id="hullD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C3763"/><stop offset="1" stop-color="#0F0D20"/></linearGradient>
    <linearGradient id="flameG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C8F8FF"/><stop offset=".3" stop-color="#19E3FF"/><stop offset="1" stop-color="#19E3FF" stop-opacity="0"/></linearGradient>
    <filter id="neon" filterUnits="userSpaceOnUse" x="-400" y="-400" width="1000" height="800">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#000" opacity=".3"/></pattern>

const SHEETS = {
 "l1": "<p>לנסות לעשות הפוך ממה שאומרים / משחק של המלך אמר.</p>\n<p>המטרה היא להראות מתי הטייס האוטומטי שולט ומתי החשיבה המבוקרת, להראות שדברים פשוטים המוח לא רוצה להתאמץ ועושה בלי לחשוב.</p>\n<p>להלן 15 משימות המבוססות על עיקרון ה\"הפוך\", המיועדות לתרגול זריז של השהיה והחלפת ה\"טייס האוטומטי\" (החיקוי) ב\"קברניט\" (החשיבה).</p>\n<p><strong>הוראה לתלמידים:</strong> \"עליכם לעשות את הפעולה ההפוכה מהפקודה שאני נותן. מי שמבצע את הפקודה המילולית – נפסל (או 'הטייס האוטומטי' ניצח).\"</p>\n<p>דוגמאות</p>\n<ol>\n<li>פקודה: \"תעמדו\" -&gt; משימה: לשבת.</li>\n<li>פקודה: \"תרימו יד ימין\" -&gt; משימה: להרים יד שמאל.</li>\n<li>פקודה: \"תסתכלו למעלה\" -&gt; משימה: להסתכל לרצפה.</li>\n<li>פקודה: \"תגידו 'בוקר טוב'\" -&gt; משימה: לומר 'לילה טוב'.</li>\n<li>פקודה: \"תסגרו את האגרוף\" -&gt; משימה: לפתוח את כף היד לרווחה.</li>\n<li>פקודה: \"תצביעו על האף\" -&gt; משימה: להצביע על האוזן.</li>\n<li>פקודה: \"תחייכו חיוך רחב\" -&gt; משימה: לעשות פרצוף רציני/עצוב.</li>\n<li>פקודה: \"תכתבו את האות א'\" -&gt; משימה: לכתוב את האות ת'.</li>\n<li>פקודה: \"תמחאו כף פעם אחת\" -&gt; משימה: להישאר עם ידיים באוויר/מאחורי הגב.</li>\n<li>פקודה: \"תעשו צעד קדימה\" -&gt; משימה: לעשות צעד אחורה.</li>\n<li>פקודה: \"תציירו עיגול\" -&gt; משימה: לצייר מרובע.</li>\n<li>פקודה: \"תלחשו את השם שלכם\" -&gt; משימה: לצעוק את השם שלכם.</li>\n<li>פקודה: \"תשימו את היד על הראש\" -&gt; משימה: להניח את היד על הברך.</li>\n<li>פקודה: \"תגידו 'כן'\" -&gt; משימה: לומר 'לא'.</li>\n<li>פקודה: \"תעצמו עיניים\" -&gt; משימה: לפקוח עיניים לרווחה.</li>\n</ol>\n<p><strong>טיפ לביצוע:</strong> ככל שתגביר את הקצב בין הפקודות, תגדיל את הסיכוי של ה\"טייס האוטומטי\" להשתלט, מה שיוצר את הדיון הנדרש על חשיבות ההשהיה (ה-\"Stop\") שילמד בשיעור הבא.</p>",
 "l2a": "<p class=\"lead\">שם המשחק: \"אור אדום – אור ירוק\" (משחקי הדיונון) / דג מלוח</p>\n<p><strong>הנחיה למורה:</strong> התלמידים עומדים בקו אחד. המטרה שלהם להגיע לקיר בצד השני של החדר.</p>\n<ul>\n<li>כשאתה אומר <strong>\"אור ירוק\"</strong> – הם הולכים/רצים לעבר הקיר.</li>\n<li>כשאתה אומר <strong>\"אור אדום\"</strong> – הם חייבים לקפוא במקום מיד.</li>\n</ul>\n<p><strong>כאן מגיע הטוויסט שדורש השהייה:</strong> המשחק עובר למצב \"מתקדם\":</p>\n<ol>\n<li><strong>איחור בתגובה:</strong> כשאומרים \"אור אדום\", מי שמצליח לעצור <em>בדיוק</em> ברגע הפקודה לא מנצח. מנצח רק מי שמצליח לעצור, להחזיק מעמד 3 שניות של שקט מוחלט, ורק אז להמשיך כשאתה נותן אישור נוסף.</li>\n<li><strong>הסחות דעת:</strong> בזמן שהם ב\"אור אדום\" (קפואים), אתה עובר ביניהם ומנסה לגרום להם לצחוק, לדבר או לזוז בלי לגעת בהם (תיאטרליות).</li>\n<li><strong>העצירה המנטלית:</strong> אם מישהו זז, הוא לא יוצא מהמשחק (כדי למנוע תסכול והימנעות), אלא צריך לבצע פעולת \"איפוס\" – לעשות נשימה עמוקה אחת ולהגיד לעצמו בקול \"עכשיו אני עוצר\" לפני שהוא חוזר להשתתף.</li>\n</ol>",
 "l2b": "<p><strong>4. תרגול אישי בכתב (15 דקות)</strong></p>\n<p><strong>משימה ממוקדת: הגדרת כפתור הבלם שלי</strong></p>\n<ol>\n<li>מתוך הכלים שהוצגו, בחר פעולת עצירה אחת (1) בלבד שאתה מעדיף לנסות:\n<ul>\n<li>לקחת נשימה אחת עמוקה.</li>\n<li>לשלב ידיים קרוב לגוף.</li>\n<li>להסתכל על חפץ קבוע בחדר (כמו השעון).</li>\n<li>להגיד לעצמי בלב את המילה \"עצור\".</li>\n<li>פעולה אחרת: ______________</li>\n</ul></li>\n<li>מתי תפעיל את פעולת העצירה הזו? (סמן אפשרות אחת):\n<ul>\n<li>מיד כשאני מגלה שיש שינוי בלוח הזמנים.</li>\n<li>מיד כשאני מקבל דף עבודה שאני לא מבין.</li>\n<li>מיד כשתלמיד אחר עושה משהו שמפריע לי.</li>\n</ul></li>\n<li>כתוב בכמה מילים: מה המטרה של הפעולה שבחרת? (היעזר בהגדרה משקופית 2).</li>\n</ol>",
 "l3": "<p><strong>המשחק: \"מצלמת האבטחה\" (15 דקות)</strong></p>\n<p><strong>מטרת המשחק:</strong> תרגול קונקרטי של הבחנה בין עובדה לפרשנות ללא חשיבה מופשטת או רפלקטיבית.</p>\n<p><strong>הנחיה למורה:</strong></p>\n<p>אתה מציג לתלמידים סיטואציות קצרות וקונקרטיות באופן תיאטרלי, או מקריא משפט. התלמידים צריכים לקבוע האם מדובר ב\"עובדה\" (מה שמצלמת אבטחה ללא רגשות הייתה מקליטה) או ב\"פרשנות\" (מה שהמוח האוטומטי המציא על הסיטואציה).</p>\n<ul>\n<li>אם זו עובדה – הם מרימים יד ומסמנים \"V\" עם האצבעות.</li>\n<li>אם זו פרשנות – הם משלבים ידיים ומסמנים \"X\".</li>\n</ul>\n<p><strong>תרחישים לתרגול:</strong></p>\n<ol>\n<li>\"דני הניח את התיק שלו על השולחן שלי\" ← <strong>עובדה</strong> (V)</li>\n<li>\"דני הניח את התיק על השולחן שלי כדי לעצבן אותי\" ← <strong>פרשנות</strong> (X)</li>\n<li>\"המורה לא פנתה אליי כשנכנסה לכיתה\" ← <strong>עובדה</strong> (V)</li>\n<li>\"המורה כועסת עלי בגלל זה היא לא אמרה לי שלום\" ← <strong>פרשנות</strong> (X)</li>\n<li>\"המבחן הזה קשה מדי ואני בטוח אכשל בו\" ← <strong>פרשנות</strong> (X)</li>\n<li>\"במבחן יש 4 שאלות שעדיין לא למדתי\" ← <strong>עובדה</strong> (V)</li>\n<li>\"חבר שלי לא ענה להודעה ששלחתי לפני שעה\" ← <strong>עובדה</strong> (V)</li>\n<li>\"חבר שלי מסנן אותי כי הוא כבר לא חבר שלי\" ← <strong>פרשנות</strong> (X)</li>\n<li>\"ההסעה מאחרת ב-10 דקות\" ← <strong>עובדה</strong> (V)</li>\n<li>\"שכחו אותי בבית הספר\" ← <strong>פרשנות</strong> (X)</li>\n</ol>",
 "l4": "<p class=\"lead\">פעילות פתיחה</p>\n<p><strong>מטרת הפעילות:</strong> להמחיש באופן ויזואלי והומוריסטי את חוסר ההתאמה הקיצוני בין גודל הבעיה האמיתי (לפי עובדות) לבין עוצמת התגובה (הרגש והאנרגיה שהאוטומט מוציא).</p>\n<p><strong>הנחיה למורה:</strong></p>\n<ol>\n<li>הזמן שני תלמידים מתנדבים לקדמת הכיתה (או שהמורה מדגים בעצמו עם תלמיד אחד).</li>\n<li>הסבר לכיתה: \"היום אנחנו הולכים לראות מה קורה כשהטייס האוטומטי שלנו מחליט לביים סצנה הוליוודית מבעיה קטנה, או להפך – מתעלם לחלוטין מבעיה רצינית\".</li>\n<li>המורה נותן לשחקנים סיטואציה פשוטה (דרגה 1 או 2), ומבקש מהם להציג אותה ב<strong>שני סבבים קיצוניים</strong>.</li>\n</ol>\n<p><strong>סבב א': \"תגובת הדרמה-קווין הקיצונית\" (תגובת יתר)</strong></p>\n<ul>\n<li><strong>התרחיש:</strong> תלמיד א' יושב בשולחן וכותב. העיפרון שלו נשבר. הוא פונה לתלמיד ב' ומבקש מחדד, אבל לתלמיד ב' אין מחדד בקלמר.</li>\n<li><strong>ההנחיה התיאטרלית (עוצמה 4-5):</strong> תלמיד א' צריך להגיב כאילו חרב עליו עולמו.\n<ul>\n<li><em>איך זה נראה על הבמה?</em> תלמיד א' קם מהכיסא, תופס את הראש, צועק לשמיים: \"למה זה תמיד קורה לי?! אין מחדד בכל הכיתה הזאת?! נכשלתי! הלכה לי השנה! המערכת קורסת!\", ואז מפיל את התיק על הרצפה או נשכב על השולחן בבכי תמרורים דרמטי.</li>\n</ul></li>\n<li><strong>עצירה של המורה לתצפית כיתתית:</strong> \"עצרו! בואו נבדוק במצלמת האבטחה: מה קרה באמת? (העיפרון נשבר, לחבר אין מחדד - דרגה 1). כמה אנרגיה יצאה כאן? (עוצמה 5). האם המחיר שווה את זה?\"</li>\n</ul>\n<p><strong>סבב ב': \"הזומבי האדיש\" (תגובת חסר)</strong></p>\n<ul>\n<li><strong>התרחיש:</strong> המורה מחלקת מבחנים. תלמיד א' מקבל את המבחן שלו ורואה ציון נכשל (45) במקצוע שהוא חייב לעבור, והמורה מודיעה לו בקול: \"אם לא תתקן את זה השבוע, לא תוכל לצאת לטיול השנתי\".</li>\n<li><strong>ההנחיה התיאטרלית (עוצמה 1 - חוסר תגובה מוחלט):</strong> תלמיד א' צריך להגיב באדישות אפסית מוחלטת של \"חוסר אכפתיות\".\n<ul>\n<li><em>איך זה נראה על הבמה?</em> תלמיד א' מסתכל על הציון, מפהק, זורק את הדף מתחת לשולחן, מוציא מסטיק, נשען אחורה בכיסא ומתחיל לזמזם שיר או לשחק באצבעות שלו כאילו הוא בחוף הים.</li>\n</ul></li>\n<li><strong>עצירה של המורה לתצפית כיתתית:</strong> \"עצרו! מה העובדות? יש פה בעיה בדרגה 3 שמשפיעה על השבוע הקרוב ועל הטיול שלו. כמה אנרגיה הוא השקיע? עוצמה 1. מה יקרה לבעיה הזו עכשיו? היא תגדל לדרגה 4 כי הוא יפסיד את הטיול\".</li>\n</ul>",
 "l5": "<p class=\"lead\">תרגול קבוצתי ממוקד נתונים</p>\n<ul>\n<li><strong>הקונספט:</strong> שימוש בכרטיסיות מספרים (1-5) כדי ליצור אומדן ויזואלי מהיר של הכיתה.</li>\n<li><strong>איך זה עובד?</strong> כל תלמיד מקבל סט כרטיסים מ-1 עד 5 (או שלט קטן). המורה מקריא תיאור של התנהגות/תגובה של נער (למשל: \"דני קיבל 60 במבחן, קרע את דף המבחן והלך הביתה בלי להגיד לאף אחד\").</li>\n<li><strong>התרגיל:</strong> בשלוש-ארבע-וסט! כל התלמידים מרימים את שלט עוצמת התגובה שהם מזהים (במקרה הזה: 5). לאחר מכן המורה שואל: \"מה היה גודל הבעיה המקורית?\" (תשובה: 2 או 3). התלמידים מחשבים את ה\"פער\" ומציעים תגובה שתאזן את המדחום.</li>\n</ul>",
 "l6": "<p class=\"lead\">פעילות פתיחה כפולה לשיעור 6</p>\n<p><strong>מטרה:</strong> תרגול מעשי של שלב ה-<strong>Identify &amp; Define</strong> (זיהוי והגדרה) מתוך מודל IDEAL. <strong>ציוד נדרש:</strong> דפי סיטואציות מודפסים מתוך הבנק (אחד לכל תלמיד), טושים שחורים עבים (מרקרים), עטים. <strong>זמן משוער:</strong> 10-15 דקות.</p>\n<p><strong>חלק א': אתגר ההשחרה (ניקוי הטייס האוטומטי) - 5 דקות</strong></p>\n<p><strong>הרציונל:</strong> אי אפשר להגדיר בעיה כשהיא עטופה בדרמה. פעולת ההשחרה מאפשרת ל\"כבות\" את הטייס האוטומטי באופן ויזואלי ומספק. <strong>הוראות למורה:</strong></p>\n<ol>\n<li>חלק לכל תלמיד דף עם סיטואציה, וטוש שחור עבה.</li>\n<li><strong>הסבר לכיתה:</strong> <em>\"קיבלתם טקסט של טייס אוטומטי בהיסטריה. המשימה שלכם: קחו את המרקר השחור והשחירו לחלוטין כל מילה שיש בה רגש, כעס, האשמה או ניחוש של העתיד. תשאירו גלוי אך ורק את מה שמצלמת אבטחה יכולה לראות ולשמוע - העובדות היבשות.\"</em></li>\n<li><strong>הדגמה על הלוח:</strong> \"המורה שונאת אותי, <strong>היא נתנה לי ציון 45 במבחן</strong>, היא עושה לי בכוונה כדי שאכשל.\" ← משחירים הכל ומשאירים רק: \"<strong>היא נתנה לי ציון 45 במבחן</strong>\".</li>\n</ol>\n<div class=\"pb\"></div><p><strong>20 משפטים להשחרת פרשנות ורגשות:</strong></p>\n<ol>\n<li>המורה נתנה לי משימה קשה מדי כי היא רוצה להכשיל אותי.</li>\n<li>המורה הודיעה ששיעור טיסה בחלל מבוטל ובמקומו יש שיעור היסטוריה, זה לא פייר, הרסו לי את כל היום, עושים לי את זה בכוונה.</li>\n<li>החברים בקבוצה שלי עצלנים, מתעלמים ממני בכוונה, חבר קבוצה אחד ממשיך לשחק בטלפון ובגללם אני אכשל במשימה.</li>\n<li>אני טיפש לגמרי, חזרתי הביתה עם ציון 45 במבחן במתמטיקה, ההורים שלי ירתחו עליי ואני בחיים לא אצליח להבין פונקציות.</li>\n<li>איזה ילד מעצבן שעושה דווקא, נכנסתי לכיתה ותלמיד אחר התיישב במקום הקבוע שלי ליד החלון והוציא קלמר.</li>\n<li>כולם פה רמאים, תלמיד שמשמש כשופט קבע שהכדור יצא החוצה לטובת הקבוצה היריבה והוא בטוח עושה את זה כדי להכשיל אותי.</li>\n<li>הם מפיצים שקר מוחלט רק כדי לפגוע בי, שני תלמידים עומדים ליד הלוקרים ומדברים בקול רם על כך שהעתקתי במבחן וקיבלתי השעיה.</li>\n<li>ההורים שלי תמיד הורסים לי הכל, סבא וסבתא מגיעים לבקר בהפתעה, אני חייב לכבות את המחשב וכל הערב שלי נהרס.</li>\n<li>אח שלי מפלצת שעושה רעש בכוונה, הוא נכנס שוב ושוב לחדר, לוקח חפצים ומשמיע מוזיקה חזקה רק כדי להכשיל אותי במבחן מחר.</li>\n<li>אני תמיד מסתבך, כרטיס הרב-קו שלי הלך לאיבוד, אין לי איך לשלם על האוטובוס ואני אתקע פה לנצח.</li>\n<li>הם עשו לי ברז, חיכיתי בפיצרייה ב-18:00 ואז הם שלחו הודעה שהם בגלידרייה במרכז השני, פשוט אי אפשר לסמוך עליהם.</li>\n<li>מנהל הקבוצה הוא סנוב רשע וכולם צבועים, הוסרתי מקבוצת הווטסאפ הכיתתית של הבילויים ואני אשאר בודד כל השנה.</li>\n<li>נכנסתי באיחור קל לכיתה והמורה אמרה בקול רם להישאר לעמוד בחוץ, זה ממש לא הוגן והיא נטפלת אליי בכוונה.</li>\n<li>הם עשו לי דווקא והמורה שונאת אותי, הגעתי לתחנה ב-08:01 והאוטובוס יצא בדיוק ב-08:00, אני בחיים לא בא יותר לבית הספר.</li>\n<li>כולם עושים עליי חרם ומתעלמים ממני, שלחתי הודעה על מפגש וכולם עשו וי כחול ולא ענו, אני מוחק את הקבוצה ויוצא ממנה עצבני.</li>\n<li>המחשב הזה שונא אותי, המסך מראה שגיאת סיסמה, אני פשוט אזרוק אותו ואלך כי במילא המורה תיתן לי אפס.</li>\n<li>איזה מזל נאחס יש לי תמיד, נשפך לי קצת מים על קצה המחברת, הכל נהרס ואני קורע את הדף ולא כותב יותר בחיים.</li>\n<li>המורה הזאת מחפשת אותי וזה חוסר צדק מוחלט, היא רשמה לי הערת משמעת ביומן ואני שונא אותה.</li>\n<li>חבר קרוב שכח להביא את המשחק, הוא ממש לא חבר אמיתי, הוא אגואיסט ואני פשוט לא אדבר איתו שבוע.</li>\n<li>החיים שלי גרועים, צלצול סוף היום הגיע והטלפון שלי לא נמצא במקום הקבוע, בטח מישהו גנב אותו כדי לעשות לי רע.</li>\n</ol>\n<p><strong>חלק ב': אתגר הניסוח (משפט הקברניט) - 5 דקות</strong></p>\n<p><strong>הרציונל:</strong> אחרי שחילצנו את העובדות, הקברניט זקוק למשפט ממוקד שמגדיר מה צריך לעשות כעת. <strong>הוראות למורה:</strong></p>\n<ol>\n<li>בקש מהתלמידים להניח את הטושים השחורים ולקחת עט.</li>\n<li><strong>הסבר לכיתה:</strong> <em>\"מעולה, ניקיתם את כל הרעש. אבל עובדות לבד לא פותרות בעיות. כדי שהקברניט יוכל לעבוד, צריך להפוך את הנתונים להגדרת בעיה. הנוסחה היא: <strong>מה המצב כרגע עובדתית? + מה המטרה/הצורך המיידי שלי?</strong>\"</em>.</li>\n<li><strong>ההנחיה למשימה:</strong> <em>\"הסתכלו על המילים שהשארתם גלויות. עכשיו, מתחת לטקסט המושחר, נסחו משפט אחד קצר שמחבר את העובדות האלו לצורך המיידי שלכם.\"</em></li>\n<li><strong>איסוף כיתתי:</strong> סבב מהיר בו כל תלמיד מקריא את משפט הקברניט שלו. בודקים יחד בעזרת \"מסננת ה-Define\" (האם יש רגש? האם זה קצר? האם זה עובדתי?).</li>\n</ol>\n<div class=\"pb\"></div><div class=\"paper-meta\"><span>שם<i></i></span><span>כיתה<i></i></span><span>תאריך<i></i></span></div><p><strong>רשימת הסיטואציות המעורבות (דף לתלמיד)</strong></p>\n<p>הנחיה לתלמיד: לפניך משפטים המתארים אירועים מהשגרה הכוללים בתוכם גם רגש, פרשנות או שיפוט עצמי. כתוב מחדש כל משפט כך שיתאר רק את העובדות בשטח, ללא פרשנות.</p>\n<ol>\n<li><strong>עבודה בקבוצות:</strong> דני ויוני שונאים אותי, אף אחד מהם לא בחר אותי כבן זוג לעבודה.</li>\n<li><strong>שיעור ספורט:</strong> כולם חושבים שאני חלש וגרוע בספורט, בגלל זה בחרו אותי אחרון לקבוצה.</li>\n<li><strong>חלוקת מבחנים:</strong> איזה טיפש אני, הוצאתי במבחן הזה 60, המורה בטח חושבת שאני לא שווה כלום.</li>\n<li><strong>צחוק בשיעור:</strong> שני התלמידים האלה מסתכלים עליי וצוחקים, הם בטוח חושבים שאני מוזרה.</li>\n<li><strong>רשתות חברתיות:</strong> שלושה חברים מהכיתה נפגשו בלעדיי, הם עושים עליי חרם ולא רוצים אותי בחבורה.</li>\n<li><strong>השתתפות בשיעור:</strong> המורה מתעלמת ממני בכוונה כי היא שונאת אותי, למרות שהצבעתי היא נתנה למישהו אחר לענות.</li>\n<li><strong>השאלת ציוד:</strong> חבר שלי קמצן ורע, הוא אמר שאין לו מחק למרות שראיתי שיש לו בקלמר.</li>\n<li><strong>קריאה בקול:</strong> איזה פדיחות, טעיתי במילה כשקראתי בקול ועכשיו כל הכיתה חושבת שאני לא יודע לקרוא.</li>\n<li><strong>היתקלות במסדרון:</strong> הילד הזה דחף אותי במסדרון והפיל לי את הספרים בכוונה כי הוא מחפש לריב.</li>\n<li><strong>שיחות פרטיות:</strong> החברות האלה בטוח מרכלות עליי מאחורי הגב, בגלל זה הן אמרו שהן לא יכולות לשתף אותי בשיחה.</li>\n<li><strong>סידור ישיבה:</strong> המחנכת רוצה להשפיל אותי מול כולם, אז היא העבירה אותי לשבת בשורה הראשונה.</li>\n<li><strong>טיול שנתי:</strong> חבר שלי כבר לא אוהב אותי, הוא שמר מקום באוטובוס למישהו אחר ולא נתן לי לשבת לידו.</li>\n<li><strong>ביטול תוכניות:</strong> חבר שלי סתם ממציא תירוצים כי לא בא לו לבלות איתי, בגלל זה הוא ביטל את הפגישה בקניון ואמר שהוא עייף.</li>\n<li><strong>שפת גוף:</strong> הילדה הזאת חושבת שמה שאני אומר זה שטויות, בגלל זה היא גלגלה עיניים כשדיברתי.</li>\n<li><strong>יום הולדת:</strong> לחבר הכי טוב שלי לא אכפת ממני בכלל, עובדה שהוא לא אמר לי מזל טוב כשהגעתי בבוקר.</li>\n<li><strong>מתן מחמאות:</strong> העבודה שלי ממש גרועה, המורה שיבחה רק עבודה של תלמיד אחר מול כל הכיתה.</li>\n<li><strong>הודעה מהבית:</strong> בטוח עשיתי משהו רע ועומדים להעניש אותי, ההורים כתבו לי לחזור הביתה מיד אחרי הלימודים.</li>\n<li><strong>הפסקה פעילה:</strong> כולם מתעלמים מהבקשות שלי בכוונה, אף אחד לא השמיע את השיר שביקשתי בהפסקה.</li>\n<li><strong>שיחה בחבורה:</strong> אני תמיד משעמם את כולם, בגלל זה מישהו קטע אותי באמצע הסיפור והתחיל לדבר על משהו אחר.</li>\n<li><strong>בזמן הקראה:</strong> המורה מזלזלת בי וחושבת שאני משעמם, עובדה שהיא פיהקה בזמן שהקראתי את העבודה.</li>\n</ol>\n<div class=\"pb\"></div><p class=\"tnote\">למורה בלבד – מומלץ לא להדפיס את העמוד הזה לתלמידים.</p><p><strong>מחוון למורה (הניסוח העובדתי המצופה מהתלמידים)</strong></p>\n<ol>\n<li><strong>עבודה בקבוצות:</strong> דני ויוני לא בחרו בי כבן זוג לעבודה.</li>\n<li><strong>שיעור ספורט:</strong> הייתי התלמיד האחרון שנבחר לקבוצה.</li>\n<li><strong>חלוקת מבחנים:</strong> קיבלתי ציון 60 במבחן.</li>\n<li><strong>צחוק בשיעור:</strong> שני תלמידים הסתכלו לכיוון שלי וצחקו.</li>\n<li><strong>רשתות חברתיות:</strong> שלושה חברים מהכיתה נפגשו היום אחר הצהריים ולא הייתי איתם.</li>\n<li><strong>השתתפות בשיעור:</strong> הצבעתי, והמורה בחרה תלמיד אחר לענות.</li>\n<li><strong>השאלת ציוד:</strong> חבר אמר שאין לו מחק, למרות שראיתי מחק בקלמר שלו.</li>\n<li><strong>קריאה בקול:</strong> קראתי בקול רם בשיעור וטעיתי בהגייה של מילה אחת.</li>\n<li><strong>היתקלות במסדרון:</strong> תלמיד נתקע בי במסדרון והספרים שלי נפלו.</li>\n<li><strong>שיחות פרטיות:</strong> חברות אמרו שהן לא יכולות לשתף אותי בשיחה.</li>\n<li><strong>סידור ישיבה:</strong> המחנכת העבירה אותי לשבת בשולחן הקדמי.</li>\n<li><strong>טיול שנתי:</strong> חבר שמר מקום באוטובוס לתלמיד אחר.</li>\n<li><strong>ביטול תוכניות:</strong> חבר ביטל את הפגישה שלנו וציין שהוא עייף.</li>\n<li><strong>שפת גוף:</strong> בזמן שדיברתי, תלמידה אחרת גלגלה את עיניה.</li>\n<li><strong>יום הולדת:</strong> החבר הטוב שלי לא אמר לי מזל טוב כשהגעתי בבוקר.</li>\n<li><strong>מתן מחמאות:</strong> המורה שיבחה עבודה של תלמיד אחר מול הכיתה.</li>\n<li><strong>הודעה מהבית:</strong> ההורים שלחו הודעה לחזור הביתה מיד בסיום הלימודים.</li>\n<li><strong>הפסקה פעילה:</strong> השיר שביקשתי לא הושמע בהפסקה.</li>\n<li><strong>שיחה בחבורה:</strong> בזמן שדיברתי, תלמיד אחר קטע אותי והתחיל לדבר על נושא אחר.</li>\n<li><strong>בזמן הקראה:</strong> המורה פיהקה בזמן שהקראתי את העבודה.</li>\n</ol>",
 "l7": "<p class=\"lead\">פרונטלית – ללא מצגת</p>\n<ul>\n<li><strong>הנחיה למורה:</strong> החזק ביד חפץ יומיומי פשוט מאוד (למשל: אטב ניירות משרדי, כוס חד-פעמית, או מפתח ישן). אל תדליק עדיין את המקרן.</li>\n<li><strong>מה לומר לתלמידים:</strong> <em>\"יש לכם בדיוק 60 שניות לרשום לעצמכם או להגיד לי כמה שיותר שימושים לחפץ הזה – חוץ מהשימוש המקורי שלו. הכלל היחיד: אסור לאף אחד להגיד 'אי אפשר' או 'זה רעיון דפוק'. פשוט תזרקו רעיונות.\"</em></li>\n<li><strong>תשובות צפויות מהכיתה:</strong> סיכה לטלפון, לפתוח מנעול, עגיל, מחזיק מפתחות, כלי לגירוד.</li>\n<li><strong>החיבור הלימודי:</strong> <em>\"שימו לב מה קרה כאן. המוח שלנו רגיל לראות חפץ ולחשוב שיש לו רק תפקיד אחד קבוע. לטייס האוטומטי שלנו קשה לראות אפשרויות אחרות. ברגע ששחררנו את החוקים והשיפוטיות, הקברניט שלכם התחיל להמציא פתרונות יצירתיים. היום אנחנו לומדים איך לעשות את זה בדיוק במצבי קושי – פותחים את המסך של המצגת ומתחילים.\"</em></li>\n</ul>",
 "l8": "<p class=\"lead\">פעילות פתיחה (חווייתית)</p>\n<ul>\n<li><strong>הנחיה למורה:</strong> הצג לתלמידים דילמה יומיומית מהירה (למשל: \"מישהו עוקף אתכם בתור לקפיטריה\").</li>\n<li><strong>המשימה:</strong> המורה מציג 3 תגובות אפשריות שונות (א' - לצעוק עליו, ב' - לעקוף אותו בחזרה, ג' - להגיד לו בצורה מכבדת שהייתם לפניו). עבור כל תגובה, התלמידים צריכים \"לקפוץ 5 דקות קדימה בזמן\" ולתאר מה יהיה המצב בכיתה או בקפיטריה בעקבותיה.</li>\n<li><strong>המסר לפעילות:</strong> הטייס האוטומטי רואה רק את הרגע הנוכחי (\"עקפו אותי - אני עצבני!\"). הקברניט מחזיק ביד \"משקפת לטווח רחוק\" ומסוגל לראות את התוצאות של הפעולה שלו לפני שהוא בכלל מבצע אותה.</li>\n</ul>\n<p><strong>התגובות והקפיצה לעתיד (לדיון מול הכיתה):</strong></p>\n<ol>\n<li><strong>תגובה א': לצעוק עליו, להעליב אותו וליצור עימות פומבי.</strong>\n<ul>\n<li><strong>שאלות הנחיה:</strong> מה יקרה בעוד 5 דקות? איפה תהיו כשישמע הצלצול?</li>\n<li><strong>צפי למנהרת הזמן:</strong> הילד השני יצעק בחזרה, ייווצר ריב גדול שאולי יגלוש לדחיפות, מורה תורן יתערב. במקום לקנות אוכל, תמצאו את עצמכם בבירור בחדר המנהלת, עצבניים ומפסידים את ההפסקה.</li>\n</ul></li>\n<li><strong>תגובה ב': להידחף בכוח קדימה ולעקוף אותו בחזרה כדי \"לא לצאת פראייר\".</strong>\n<ul>\n<li><strong>שאלות הנחיה:</strong> איך יגיבו שאר הילדים בתור? איך ירגיש הגוף שלכם בעוד 5 דקות?</li>\n<li><strong>צפי למנהרת הזמן:</strong> התור יהפוך לכאוס. הילד השני ידחוף בחזרה, שאר הילדים יתחילו לצעוק כי כולם נדחפים. כשתגיעו לשיעור הבא, תהיו נסערים, מזיעים, ויתקשה עליכם להתרכז בשיעור.</li>\n</ul></li>\n<li><strong>תגובה ג': לנשום, ולהגיד לו בצורה מכבדת ותקיפה: \"סליחה, אני עמדתי פה לפניך, בבקשה תחזור למקום שלך.\"</strong>\n<ul>\n<li><strong>שאלות הנחיה:</strong> האם הבעיה תיפתר? איך תיכנסו לשיעור הבא?</li>\n<li><strong>צפי למנהרת הזמן:</strong> רוב הסיכויים שהילד יזוז אחורה, התור ימשיך כרגיל, תספיקו לקנות את האוכל ותיכנסו לשיעור הבא רגועים, עם תחושת שליטה עצמית וגאווה על כך שניהלתם את האירוע בבגרות.</li>\n</ul></li>\n</ol>\n<div class=\"pb\"></div><p>להלן 5 דילמות נוספות לפעילות \"מנהרת הזמן\", הבנויות באותו הפורמט, לקוחות מחיי היומיום של תלמידי חטיבת הביניים:</p>\n<p><strong>דילמה 1: הודעה בוואטסאפ הכיתתי</strong></p>\n<ul>\n<li><strong>הדילמה:</strong> שלחת תמונה או שאלה בקבוצת הוואטסאפ של הכיתה, ותלמיד אחר הגיב עם סטיקר מעליב או עקיצה שגרמה לכולם לשלוח סמיילי צוחק.</li>\n<li><strong>תגובה א': לתקוף חזרה.</strong> לכתוב לו מיד עלבון גרוע יותר ולהתחיל מלחמת קללות בקבוצה.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> הקבוצה תהיה בטירוף, המורה או ההורים כנראה יתערבו, הטלפון לא יפסיק לרטוט, ותמצאו את עצמכם עצבניים, פגועים ומסובכים.</li>\n</ul></li>\n<li><strong>תגובה ב': להיעלב דרמטית.</strong> לצאת מקבוצת הכיתה בכעס.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> תרגישו מנותקים, כולם ידברו על זה שעזבתם, תפסידו עדכונים חשובים, ונתתם לילד המעליב כוח לגרום לכם לברוח.</li>\n</ul></li>\n<li><strong>תגובה ג': קברניט.</strong> להשתיק את הקבוצה לשעה, לא להגיב באותו רגע, או לכתוב לו בפרטי מאוחר יותר \"לא מתאים מה שכתבת\".\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> הדרמה תירגע מהר, לא סיפקתם לילד המעליב את ההצגה שהוא רצה, תרגישו בשליטה ולא תהרסו לעצמכם את אחר הצהריים.</li>\n</ul></li>\n</ul>\n<p><strong>דילמה 2: הציון המאכזב</strong></p>\n<ul>\n<li><strong>הדילמה:</strong> המורה מחלקת מבחנים. למדתם ממש קשה למבחן הזה, אבל כשאתם מסתכלים על הדף, אתם רואים ציון 55.</li>\n<li><strong>תגובה א': זעם.</strong> לקמט את המבחן, לזרוק אותו על השולחן ולהגיד בקול: \"המבחן הזה לא הוגן, את מורה גרועה!\".\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> תמצאו את עצמכם מחוץ לכיתה או בדרך לבירור, איבדתם כל סיכוי לקבל מועד ב' או עזרה מהמורה, והציון יישאר 55.</li>\n</ul></li>\n<li><strong>תגובה ב': ייאוש.</strong> לשים את הראש על השולחן, להחליט שאתם סתומים, ולא לכתוב כלום בשאר השיעור.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> תפסידו את החומר של השיעור הנוכחי, תרגישו אומללים ותבטיחו לעצמכם כישלון גם במבחן הבא.</li>\n</ul></li>\n<li><strong>תגובה ג': קברניט.</strong> לקחת נשימה עמוקה, להכניס את המבחן לתיק, ולהחליט שניגשים למורה בסוף השיעור כדי לבקש שתסביר איפה טעיתם ואם אפשר לתקן.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> תהיו אמנם מאוכזבים, אבל רגועים. תהיה לכם תוכנית פעולה להמשך ותשמרו על יחסים טובים עם המורה.</li>\n</ul></li>\n</ul>\n<p><strong>דילמה 3: חלוקה לעבודה בזוגות</strong></p>\n<ul>\n<li><strong>הדילמה:</strong> המורה מחלקת את הכיתה לעבודת הגשה בזוגות, ומצוותת אתכם עם תלמיד שאתם לא כל כך אוהבים או כזה שידוע בתור אחד שלא עושה כלום.</li>\n<li><strong>תגובה א': למחות בקול.</strong> לצעוק מול כל הכיתה: \"אין סיכוי! אני לא עובד איתו, הוא אף פעם לא עושה כלום!\".\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> המורה תכעס עליכם על החוצפה, הילד השני ייעלב, והאווירה תהיה עכורה. בטוח לא תצליחו לעבוד יחד עכשיו.</li>\n</ul></li>\n<li><strong>תגובה ב': לשתוק ולסבול.</strong> לא להגיד כלום, לעשות את כל העבודה לבד ולהיות ממורמרים כל החודש הקרוב.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> תרגישו פראיירים ועמוסים. הילד השני יבין שהוא לא צריך להתאמץ כי אתם עושים הכל.</li>\n</ul></li>\n<li><strong>תגובה ג': קברניט.</strong> לגשת לילד ברוגע ולחלק משימות מראש (\"אני אעשה את חלק א', אתה את חלק ב'\"), או לבקש מהמורה בשקט עזרה בחלוקת התפקידים.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> תהיה לכם תוכנית עבודה ברורה, תרגישו הקלה, ותתנו לשותף שלכם הזדמנות הוגנת לתרום את חלקו באווירה טובה.</li>\n</ul></li>\n</ul>\n<p><strong>דילמה 4: היתקלות במסדרון</strong></p>\n<ul>\n<li><strong>הדילמה:</strong> אתם הולכים במסדרון עם כוס ברד שקניתם, מישהו רץ מולכם, נתקע בכם, הברד נשפך לכם על החולצה והוא ממשיך לרוץ בלי לבקש סליחה.</li>\n<li><strong>תגובה א': אלימות.</strong> לרדוף אחריו, לתפוס אותו בחולצה ולדחוף אותו על הלוקרים.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> תהיו בעיצומה של קטטה או אצל רכזת המשמעת, תקבלו עונש חמור, והחולצה שלכם עדיין תהיה רטובה ודביקה.</li>\n</ul></li>\n<li><strong>תגובה ב': השפלה פומבית.</strong> לצרוח עליו קללות מול כל המסדרון כדי שכולם ישמעו שהוא אידיוט.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> כולם יסתכלו עליכם, תרגישו מובכים ומוקדים לתשומת לב שלילית, והמצב לא ייפתר.</li>\n</ul></li>\n<li><strong>תגובה ג': קברניט.</strong> ללכת לשירותים, לנקות את החולצה עם נייר, ולגשת אליו ברוגע בהפסקה הבאה ולהגיד: \"היי, מקודם נתקעת בי ונשפך עליי הכל, ציפיתי שתעצור להגיד סליחה\".\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> החולצה שלכם תתחיל להתייבש, תהיו רגועים בכיתה, ומנעתם מעצמכם עונש מיותר על קטטה.</li>\n</ul></li>\n</ul>\n<p><strong>דילמה 5: השמועה</strong></p>\n<ul>\n<li><strong>הדילמה:</strong> חברה ניגשת אלייך בהפסקה ואומרת: \"שמעת? רוני אמרה עלייך משהו ממש מגעיל מאחורי הגב לחבורה של בנים\".</li>\n<li><strong>תגובה א': פיצוץ.</strong> לרוץ ישר לרוני ולהתחיל לצעוק עליה באמצע החצר מול כולם.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> תצרו דרמה ענקית. אולי בכלל יתברר שהחברה הגזימה או המציאה, ואתן תצאו אלו שאיבדו שליטה.</li>\n</ul></li>\n<li><strong>תגובה ב': נקמה מאחורי הגב.</strong> להתחיל להמציא מיד שמועה נוראית יותר על רוני ולהפיץ אותה.\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> יצרתם סביבה רעילה, הכנסתם את עצמכם למעגל של ריבים ולכלוכים שבסוף יפגע גם בכן.</li>\n</ul></li>\n<li><strong>תגובה ג': קברניט.</strong> לקחת רגע לחשוב. לגשת לרוני כשהיא לבד ולהגיד לה בצורה עניינית: \"היי, שמעתי שאמרת עליי משהו כזה וכזה, זה נכון?\".\n<ul>\n<li><em>מנהרת הזמן (בעוד 5 דקות):</em> תבררו את האמת בבגרות, תמנעו דרמה מיותרת בחצר, ורוב הסיכויים שתקבלו תשובה כנה או התנצלות.</li>\n</ul></li>\n</ul>"
};

SHEETS.l5b = "<p><strong>הסוללה שנגמרה:</strong> רועי ישב בהפסקה ושיחק בטלפון. פתאום הסוללה נגמרה והטלפון נכבה. בתגובה, רועי זרק את הטלפון על הרצפה בעצבים, בעט בתיק שלו וקילל בקול רם.</p>\n<p><strong>נגמר האוכל בקפיטריה:</strong> מאיה עמדה בתור לקפיטריה. כשהגיע תורה, בדיוק נגמרו הלחמניות עם השניצל שהיא רצתה. מאיה צעקה על המוכר \"אתם תמיד עושים לי דווקא!\", טרקה את חלון הקפיטריה והלכה בכעס.</p>\n<p><strong>החלפת מקום בשיעור:</strong> המורה ביקשה מיונתן לעבור לשבת בשולחן אחר כי הוא דיבר עם חבר. יונתן קם, דחף את הכיסא שלו ברעש, אמר \"אני לא לומד פה יותר\" ויצא מהכיתה בטריקת דלת.</p>\n<p><strong>מים על המחברת:</strong> בטעות, חברה שפכה כמה טיפות מים מהבקבוק על קצה המחברת של נועה. נועה לקחה את הבקבוק שלה ושפכה את כולו במכוון על התיק של החברה.</p>\n<p><strong>הפסד בטורניר:</strong> קבוצת הכדורגל של אלון הפסידה במשחק צמוד בהפסקה. אלון לקח את הכדור, בעט אותו חזק מעבר לגדר של בית הספר וסירב ללחוץ יד לשחקני הקבוצה השנייה.</p>\n<p><strong>הסינון בוואטסאפ:</strong> נועם שלח הודעה לחבר. החבר ראה את ההודעה (וי כחול) ולא ענה במשך שעתיים. נועם חסם את החבר בוואטסאפ ובאינסטגרם, וכתב בקבוצה של הכיתה שאי אפשר לסמוך עליו.</p>\n<p><strong>שכחת הציוד:</strong> בזמן עבודה בקבוצות, דנה גילתה שהשותפה שלה שכחה להביא את הצבעים. דנה קמטה את הבריסטול של העבודה, זרקה אותו לפח ואמרה \"בגללך נקבל אפס, אני לא עושה איתך כלום\".</p>\n<p><strong>היתקלות במסדרון:</strong> בהפסקה העמוסה, מישהו נתקע בטעות בכתף של עומר והמשיך ללכת כי מיהר. עומר רץ אחריו, תפס אותו בחולצה ודחף אותו לקיר.</p>\n<p><strong>בוחן הפתע:</strong> המורה למדעים הודיעה שיש עכשיו בוחן פתע קצר על שיעורי הבית. שירה התחילה לבכות בהיסטריה, שמה את הראש על השולחן וסירבה לקחת את טופס הבוחן.</p>\n<p><strong>שינוי בשיעור ספורט:</strong> המורה לספורט הודיע שהיום לא משחקים כדורסל אלא עושים ריצת אלף מטר. גיא הפנה את הגב למורה, הלך לשבת בצד על הספסל ושם אוזניות בהפגנתיות.</p>";
SHEETS.l5c = "<div class=\"kit\"><p><strong>הסוללה שנגמרה</strong></p><ul><li><strong>מדחום הבעיה:</strong> 1</li><li><strong>מדחום התגובה:</strong> 5</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא. נער יכול להתמודד עם זה בעצמו (להכניס לתיק, לבקש מטען מחבר או לחכות הביתה).</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> הבעיה המקורית נפתרת ברגע שמגיעים הביתה למטען. התגובה (שבירת הטלפון) תדרוש ימים או שבועות לתיקון המכשיר ובירור משמעתי על ההתפרצות.</li></ul></div>\n<div class=\"kit\"><p><strong>נגמר האוכל בקפיטריה</strong></p><ul><li><strong>מדחום הבעיה:</strong> 2</li><li><strong>מדחום התגובה:</strong> 4</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא. בחירת אוכל חלופי היא החלטה עצמאית של התלמיד.</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> בחירת כריך אחר לוקחת דקה. התגובה הקיצונית יצרה רעב לכל היום, ותדרוש זמן לשיחת בירור והתנצלות בפני עובד הקפיטריה.</li></ul></div>\n<div class=\"kit\"><p><strong>החלפת מקום בשיעור</strong></p><ul><li><strong>מדחום הבעיה:</strong> 2</li><li><strong>מדחום התגובה:</strong> 5</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא (המבוגר יצר את ההנחיה, אך ההתמודדות איתה - לקום ולעבור כיסא - היא באחריות התלמיד ולא דורשת סיוע).</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> מעבר מקום דורש 10 שניות. התגובה (יציאה מהכיתה) תדרוש בירור משמעתי, שיחת הורים והשלמת החומר שהופסד.</li></ul></div>\n<div class=\"kit\"><p><strong>מים על המחברת</strong></p><ul><li><strong>מדחום הבעיה:</strong> 1</li><li><strong>מדחום התגובה:</strong> 5</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא. התלמיד יכול פשוט לנגב את המים בנייר.</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> ניגוב המים דורש חצי דקה. התגובה (הרס ציוד של אחר) תדרוש פיצוי כספי, התערבות מורה, וימים ארוכים לשיקום הקשר החברתי.</li></ul></div>\n<div class=\"kit\"><p><strong>הפסד בטורניר</strong></p><ul><li><strong>מדחום הבעיה:</strong> 2</li><li><strong>מדחום התגובה:</strong> 5</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא. התמודדות עם תסכול מהפסד היא חלק טבעי ממשחק עם בני הגיל.</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> תחושת האכזבה עוברת לרוב אחרי שעה. התגובה תדרוש חיפוש של הכדור האבוד, עונש משמעתי והתנצלות פומבית.</li></ul></div>\n<div class=\"kit\"><p><strong>הסינון בוואטסאפ</strong></p><ul><li><strong>מדחום הבעיה:</strong> 1</li><li><strong>מדחום התגובה:</strong> 5</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא. המתנה לתשובה אינה דורשת תיווך.</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> הבעיה המקורית נפתרת מעצמה ברגע שהחבר יתפנה לענות. התגובה (חסימה ושיימינג בקבוצה) תדרוש תיווך חברתי ממושך לשיקום האמון ולמניעת סכסוך כיתתי.</li></ul></div>\n<div class=\"kit\"><p><strong>שכחת הציוד</strong></p><ul><li><strong>מדחום הבעיה:</strong> 2</li><li><strong>מדחום התגובה:</strong> 5</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא. תלמידים יכולים לבקש להשאיל מצוות אחר או לאלתר פתרון.</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> השגת צבעים תיקח 5 דקות. התגובה (הריסת הבריסטול) הרסה ימי עבודה שלמים ותדרוש התערבות מורה כדי לגשר על הפיצוץ בין השותפות.</li></ul></div>\n<div class=\"kit\"><p><strong>היתקלות במסדרון</strong></p><ul><li><strong>מדחום הבעיה:</strong> 1</li><li><strong>מדחום התגובה:</strong> 5</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא. אפשר פשוט להמשיך ללכת.</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> הבעיה המקורית לא דרשה תיקון כלל. התגובה האלימה תוביל להשעיה ולטיפול משמעתי ארוך טווח.</li></ul></div>\n<div class=\"kit\"><p><strong>בוחן הפתע</strong></p><ul><li><strong>מדחום הבעיה:</strong> 3</li><li><strong>מדחום התגובה:</strong> 4</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא. למרות הלחץ, התלמיד נדרש לגייס כוחות בעצמו ולגשת לבוחן.</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> הבוחן דורש 10 דקות של מאמץ וריכוז. התגובה (היסטריה וסירוב) תדרוש שיחת הרגעה ארוכה, התמודדות עם ציון אפס, וקושי לגשת למבחנים הבאים.</li></ul></div>\n<div class=\"kit\"><p><strong>שינוי בשיעור ספורט</strong></p><ul><li><strong>מדחום הבעיה:</strong> 2</li><li><strong>מדחום התגובה:</strong> 4</li><li><strong>התערבות מבוגר לפתרון הבעיה המקורית:</strong> לא. קבלת שינויים בלוז היא חלק משגרת בית הספר.</li><li><strong>זמן תיקון הבעיה לעומת זמן תיקון התגובה:</strong> הריצה דורשת 10 דקות של מאמץ גופני. התגובה (סירוב פקודה) תדרוש שיחת בירור ולעיתים ענישה משמעתית על התעלמות מסמכות.</li></ul></div>";
SHEETS.l9 = "<p class=\"lead\">1. חלק לתלמידים: דילמות לניתוח \"הקופסה השחורה\" (Look back &amp; Learn)</p>\n<p><strong>דילמה 1: שינוי התוכנית בבית</strong></p>\n<p><strong>התרחיש:</strong> תכננת לשחק במחשב עם חברים ברשת ב-19:00. ב-18:45 אמא נכנסה לחדר ואמרה שסבא וסבתא מגיעים לבקר בהפתעה, וצריך לכבות את המחשב ולשבת איתם בסלון. לחצת על Stop ובחרת בנתיב של תקשורת: אמרת לאמא ברצינות ובקול רם: \"זה ממש לא פייר, תמיד אתם הורסים לי תוכניות בדיוק כשאני קובע עם חברים\". אמא התעצבנה על הטון והאשמות, אמרה שאתה לא מכבד, ואסרה עליך לגעת במחשב גם מחר.</p>\n<p><strong>שאלות לניתוח הקופסה השחורה (הקברניט):</strong></p>\n<ul><li><strong>מבחן המטרה:</strong></li><li><strong>מה עבד טוב?</strong></li><li><strong>מה לא עבד?</strong></li><li><strong>מה תכתוב ביומן הטיסה לפעם הבאה?</strong></li></ul>\n<p><strong>דילמה 2: משימה קבוצתית תקועה</strong></p>\n<p><strong>התרחיש:</strong> המורה נתנה משימה קבוצתית להגשה עד סוף השיעור. אחד מחברי הקבוצה התעלם מהמשימה והמשיך לשחק בטלפון. הגדרת את הבעיה בראש ובחרת בנתיב עזרה: ניגשת מיד למורה באמצע הכיתה ואמרת לה בקול: \"דני לא עושה כלום ורק בטלפון, הוא הורס לנו את הציון\". המורה ענתה: \"תסתדרו לבד, אתם כבר בחטיבה\", ודני כעס עליך, קרא לך \"מלשין\" ולא הסכים לדבר איתך עד סוף היום.</p>\n<p><strong>שאלות לניתוח הקופסה השחורה (הקברניט):</strong></p>\n<ul><li><strong>מבחן המטרה והמחיר:</strong></li><li><strong>מה עבד טוב?</strong></li><li><strong>מה לא עבד?</strong></li><li><strong>מה תכתוב ביומן הטיסה לפעם הבאה?</strong></li></ul>\n<p><strong>דילמה 3: טעות שיפוט במשחק בהפסקה</strong></p>\n<p><strong>התרחיש:</strong> שיחקת כדורגל בהפסקה במגרש. השופט קבע שהכדור יצא החוצה ממך, למרות שהיית בטוח לחלוטין שהוא נגע ביריב. לחצת על Stop ובחרת בנתיב של גמישות עצמית: אמרת לעצמך \"אני מוותר, לא נכנס לריב\". יצאת מהמגרש בהפגנתיות, ישבת על הספסל בצד בפה סגור, ולא הסכמת לחזור לשחק עד סוף ההפסקה למרות שחברים קראו לך.</p>\n<p><strong>שאלות לניתוח הקופסה השחורה (הקברניט):</strong></p>\n<ul><li><strong>מבחן המטרה:</strong></li><li><strong>מה עבד טוב?</strong></li><li><strong>מה לא עבד?</strong></li><li><strong>מה תכתוב ביומן הטיסה לפעם הבאה?</strong></li></ul>\n<div class=\"pb\"></div><p class=\"tnote\">למורה בלבד – מומלץ לא להדפיס את העמוד הזה לתלמידים.</p>\n<p class=\"lead\">2. חלק למורה: תשובות וניתוח פדגוגי</p>\n<p><strong>פתרון וניתוח – דילמה 1: שינוי התוכנית בבית</strong></p>\n<ul><li><strong>מבחן המטרה והמחיר:</strong> הפתרון נכשל. הצורך לשמור על קשר עם החברים ולשחק לא נענה, והמחיר ששולם היה החמרה של הבעיה (עונש של איסור מחשב גם למחר).</li><li><strong>מה עבד טוב:</strong> התלמיד הצליח ללחוץ על ה-Stop ולא התפוצץ מיד בצעקות, בבריחה או בטריקת דלת.</li><li><strong>מה לא עבד:</strong> ניסוח הפנייה והטון. בנתיב התקשורת שולבו האשמות כוללניות (\"תמיד אתם הורסים לי\"). במקום להגדיר את הבעיה עובדתית (מצב + צורך: \"אני צריך 2 דקות לעדכן את החברים שלא יחכו לי\"), התלמיד הפעיל את המגננה של ההורה.</li><li><strong>משפט ליומן הטיסה (תובנת הקברניט):</strong> \"למדתי שבנתיב תקשורת מול הורים, אסור להשתמש במילות האשמה ('תמיד/אתם'). עדיף להגדיר בקשה עובדתית ממוקדת: 'אני חייב דקה לשלוח הודעה לחברים לבטל, ואז אבוא לסלון'\".</li></ul>\n<p><strong>פתרון וניתוח – דילמה 2: משימה קבוצתית תקועה</strong></p>\n<ul><li><strong>מבחן המטרה והמחיר:</strong> הפתרון נכשל. המשימה לא התקדמה, ובנוסף שולם מחיר חברתי יקר של פגיעה ביחסים והשפלה.</li><li><strong>מה עבד טוב:</strong> התלמיד זיהה נכון את גודל הבעיה (בעיה בדרגה 2 הדורשת פתרון בתוך חלון הזמן של השיעור) ואת הצורך להתקדם.</li><li><strong>מה לא עבד:</strong> דילוג על שלושת הנתיבים והליכה ישירה לנתיב עזרה/פנייה למורה (שהוא נתיב אחרון ולא ראשון). בנוסף, הפנייה למורה נעשתה בצורת האשמה פומבית ליד כל הכיתה.</li><li><strong>משפט ליומן הטיסה (תובנת הקברניט):</strong> \"למדתי לפני שפונים למורה (נתיב עזרה), יש לנסות קודם נתיב תקשורת ישירה בגובה העיניים מול החבר ('בוא נעשה חצי-חצי כדי שנסיים מהר'), או לפנות למורה בצורה שקטה ופרטית מבלי להאשים ליד כולם\".</li></ul>\n<p><strong>פתרון וניתוח – דילמה 3: טעות שיפוט במשחק בהפסקה</strong></p>\n<ul><li><strong>מבחן המטרה והמחיר:</strong> הפתרון נכשל. המטרה ליהנות מההפסקה התפספסה, והתלמיד העניש את עצמו בהפסד של כל המשחק.</li><li><strong>מה עבד טוב:</strong> שליטה ביצרי האוטומט – התלמיד נמנע מצעקות, מקללות או מפתח תגרה פיזית מול השופט או היריבים.</li><li><strong>מה לא עבד:</strong> בלבול בין גמישות מחשבתית לבין הימנעות/ברוגז. גמישות פירושה להתאים את עצמי למצב ולהמשיך לשחק, בעוד שהתלמיד בחר בברוגז פסיבי-אגרסיבי שהרס לו את הפנאי.</li><li><strong>משפט ליומן הטיסה (תובנת הקברניט):</strong> \"למדתי שגמישות אמיצה פירושה לקבל החלטת שופט גם כשאינה מוצאת חן בעיניי ולהמשיך לשחק, ולא 'להעניש' את עצמי בישיבה בצד בגלל אירוע בדרגה 1\".</li></ul>";

line-start:3px solid var(--teal);padding-inline-start:16px;margin-bottom:1.2em}\n.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:8px;max-width:420px;margin:1.2em 0 1.4em}\n.strip .sm{aspect-ratio:1;padding:6px;border:1px solid var(--line);background:var(--hull-2);animation:enter .6s ease both}\n.field{display:flex;flex-direction:column;gap:8px;margin:1em 0;max-width:460px}\n.field label{color:var(--mute);font-size:.8em}\ninput[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--void);border:1px solid var(--line);padding:12px 14px;width:100%;border-radius:2px}\ntextarea{min-height:110px;resize:vertical}\ndetails{margin:.4em 0 1.2em;color:var(--mute);font-size:.8em;max-width:460px}\nsummary{cursor:pointer;padding:6px 0}\ndetails .field{margin:.6em 0}\n.total{color:var(--teal);font-size:.85em;margin:.2em 0 1em}\n\n/* ---------- buttons ---------- */\n.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:2px;background:var(--amber);color:#1a1205;padding:14px 30px;transition:transform .12s ease,background .12s ease}\n.btn:hover:not(:disabled){background:#ffc263;transform:translateY(-1px)}\n.btn:disabled{opacity:.5;cursor:default}\n.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}\n.btn.ghost:hover{background:rgba(56,217,197,.1)}\nbutton:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:3px}\n.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}\n\n/* ---------- tool round ---------- */\n.tgrid{display:grid;grid-template-columns:minmax(84px,112px) 1fr;gap:clamp(14px,2.4vw,26px);align-items:center;margin-bottom:22px}\n@media (max-width:640px){.tgrid{grid-template-columns:90px 1fr}}\n.istage{position:relative;aspect-ratio:1;padding:14px;border:1px solid var(--line);background:radial-gradient(circle at 50% 45%,rgba(56,217,197,.14),transparent 70%),var(--void)}\n.istage .ico{transition:filter .6s ease,transform .6s cubic-bezier(.2,1.5,.4,1)}\n.istage.mystery .ico{filter:grayscale(1) brightness(.22) contrast(1.3)}\n.istage .q{position:absolute;inset:0;display:grid;place-items:center;font-family:\"Secular One\",\"Rubik\",sans-serif;font-size:2.4em;color:var(--amber);opacity:0;pointer-events:none;transition:opacity .4s}\n.istage.mystery .q{opacity:.9}\n.istage.revealed .ico{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}\n.istage.revealed{box-shadow:0 0 0 1px var(--teal),0 0 22px rgba(56,217,197,.22)}\n@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}\n.signal{background:var(--void);border:1px solid var(--line);border-inline-start:4px solid var(--teal);padding:18px 22px;font-size:1.05em}\n.signal.name{font-family:\"Secular One\",\"Rubik\",sans-serif;font-size:1.6em;color:var(--amber)}\n.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.opts.long{grid-template-columns:1fr}\n@media (max-width:700px){.opts{grid-template-columns:1fr}}\n.opt{font:inherit;text-align:start;cursor:pointer;color:var(--ink);background:var(--hull-2);border:1px solid var(--line);padding:16px 18px;border-radius:2px;transition:background .12s ease,border-color .12s ease}\n.opts.long .opt{font-size:.9em}\n.opt:hover:not(:disabled){background:#1f2948;border-color:var(--teal)}\n.opt:disabled{cursor:default}\n.opt.correct{border-color:var(--teal);background:rgba(56,217,197,.16)}\n.opt.wrong{border-color:var(--rose);background:rgba(255,107,143,.13)}\n.opt.dim{opacity:.45}\n.feedback{margin-top:18px;min-height:1.5em;font-weight:500;max-width:70ch}\n.feedback.good{color:var(--teal)}\n.feedback.soft{color:var(--amber)}\n.discuss{margin-top:12px;padding:12px 16px;border:1px dashed var(--line);color:var(--ink);font-size:.9em;max-width:70ch}\n\n/* ---------- matching round ---------- */\n.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}\n@media (max-width:700px){.match{grid-template-columns:1fr}}\n.mat sition:absolute;inset-inline:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--teal),transparent);box-shadow:0 0 18px var(--teal);animation:scan 1.6s ease-in-out 1 both}\n@keyframes scan{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:calc(100% - 3px);opacity:0}}\n.scenebox .ico{animation:enter .8s ease .2s both}\n\n/* ---------- gauge + tank ---------- */\n.gbox{border:1px solid var(--line);background:var(--void);padding:10px;max-width:210px;margin-inline:auto;width:100%}\n.gbox .cap{text-align:center;font-size:.75em;color:var(--mute)}\n.gauge{width:100%;display:block}\n.gauge .needle{transition:transform 1s cubic-bezier(.3,1.4,.5,1)}\n.gauge .seg{fill:none;stroke-width:18}\n.gauge text{font-family:\"Secular One\",\"Rubik\",sans-serif;font-size:17px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}\n.tank{width:100%;max-width:130px;display:block;margin-inline:auto}\n.tank .frame{fill:var(--void);stroke:var(--line);stroke-width:2}\n.tank .cell{fill:rgba(255,255,255,.06);transition:fill .35s ease}\n.tank .cell.on{fill:var(--amber)}\n.tank .cell.over{fill:var(--rose)}\n.tank text{font-family:\"Secular One\",\"Rubik\",sans-serif;font-size:15px;fill:var(--mute);text-anchor:middle;dominant-baseline:central}\n.tank .lim{stroke:var(--teal);stroke-width:2;stroke-dasharray:5 4}\n.tank .limtxt{fill:var(--teal);font-size:12px;font-family:\"Rubik\",sans-serif}\n.tank.shake{animation:shake .5s ease}\n.tank.glow{filter:drop-shadow(0 0 14px rgba(56,217,197,.55))}\n\n/* ---------- scales ---------- */\n.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}\n.sz{font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px 10px 18px;color:var(--ink);background:var(--hull-2);border:1px solid var(--line);border-radius:2px;transition:background .12s ease,border-color .12s ease}\n.sz .n{font-family:\"Secular One\",\"Rubik\",sans-serif;font-size:2.1em;line-height:1}\n.sz .cap{font-size:.72em;line-height:1.4}\n.sz:hover:not(:disabled){border-color:var(--amber);background:#1f2948}\n.sz:disabled{cursor:default}\n.sz.sel{background:var(--amber);color:#1a1205;border-color:var(--amber)}\n.sz.ok{background:var(--teal);color:#06231f;border-color:var(--teal)}\n.sz.near{background:rgba(255,177,59,.28);color:var(--ink);border-color:var(--amber)}\n.sz.miss{background:var(--hull-2);color:var(--ink);border-color:var(--rose);border-width:2px}\n.sz.dim{opacity:.4}\n.block{margin-top:26px}\n.block h3{font-size:1.15em;color:var(--ink)}\n.badge{display:inline-block;background:var(--amber);color:#1a1205;font-weight:700;padding:2px 12px;margin-inline-start:8px}\n.proposal{background:var(--void);border:1px solid var(--line);border-inline-start:4px solid var(--teal);padding:14px 20px;margin-top:14px}\n.proposal .tag{color:var(--teal);font-size:.8em;margin-bottom:2px}\n\n/* ---------- solution paths ---------- */\n.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0 16px}\n.pcard{font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;color:var(--ink);background:var(--hull-2);border:1px solid var(--line);border-radius:2px;transition:background .12s,border-color .12s,transform .12s}\n.pcard .pi{width:38px;height:38px}\n.pcard:hover:not(:disabled){border-color:var(--amber)}\n.pcard[aria-pressed=\"true\"]{border-color:var(--teal);background:rgba(56,217,197,.18);transform:translateY(-3px)}\n.pcard:disabled{cursor:default}\n\n/* ---------- stop interlude ---------- */\n.stopwrap{position:relative;width:min(100%,140px);aspect-ratio:1;margin:0 auto}\n.stopbtn{position:absolute;inset:14%;border:0;background:none;padding:0;cursor:pointer;transition:transform .15s}\n.stopbtn:hover:not(:disabled){transform:scale(1.06)}\n.stopbtn:active:not(:disabled){transform:scale(.94)}\n.stopbtn:disabled{cursor:default}\n.ring{position:absolute;inset:0;width:100%;height:100%}\n.ring .rbg{fill:none;stroke:var(--line);stroke-width:6}\n.ring .rfg{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}\n.ring.run .rfg{transition:stroke-dashoffset 4s linear;stroke-dashoffset:0}\n.cnt{position:absolute;inset:0;display:grid;place-items:center;font-family:\"Secular One\",\"Rubik\",sans-serif;font-size:2em;color:var(--ink);pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6)}\n.alert{display:flex;align-items:center;gap:12px;color:var(--rose);font-weight:700;margin-bottom:12px}\n.alert i{width:14px;height:14px;border-radius:50%;background:var(--rose);box-shadow:0 0 14px var(--rose);flex:none}\n\n/* ---------- warp ---------- */\n.warp{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}\n.warp i{position:absolute;left:50%;top:46%;width:2px;height:55vmax;transform-origin:0 0;background:linear-gradient(180deg,rgba(190,232,255,0),rgba(190,232,255,.8));animation:streak .85s ease-in-out var(--d) both}\n@keyframes streak{0%{transform:rotate(var(--a)) scaleY(0);opacity:0}45%{opacity:.8}100%{transform:rotate(var(--a)) scaleY(1);opacity:0}}\n\n/* ---------- license ---------- */\n.license{position:relative;overflow:hidden;text-align:center;padding:clamp(26px,5vw,60px);background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(255,177,59,.16),transparent 70%),linear-gradient(180deg,#1a2240,#0e1426);border:2px solid var(--amber);outline:1px solid var(--line);outline-offset:8px;margin:10px 8px 30px}\n.license .seal{width:clamp(64px,9vw,96px);margin:0 auto 14px;display:block}\n.license h1{color:var(--tier);font-size:clamp(1.8rem,4.4vw,3.2rem);margin-bottom:.3em}\n.license .crewname{font-family:\"Secular One\",\"Rubik\",sans-serif;font-size:1.5em;margin:.2em 0 .6em}\n.license p{margin-inline:auto}\n.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 34px;margin:20px 0 6px;color:var(--mute);font-size:.8em}\n.stats b{color:var(--ink);font-size:1.25em;display:block}\n.s <\/span><\/div>\n      <div class=\"prog\"><span id=\"progTxt\"><\/span><div class=\"route\" id=\"route\"><\/div><\/div>\n    <\/div>\n  <\/header>\n  <main id=\"stage\"><\/main>\n<\/div>\n\n<script>\n/* =============== המאגר המאושר בלבד =============== */\nconst TOOLS = [\n  {id:'auto', name:'הטייס האוטומטי',\n   short:'מגיב לסכנה מיד, מתוך כעס, הימנעות או פחד',\n   desc:'המערכת במוח שמגיבה לסכנה באופן מיידי, מתוך כעס, הימנעות או פחד. מטרתה היא הגנה הישרדותית.'},\n  {id:'stop', name:'כפתור ה-Stop',\n   short:'עצירה של 3 עד 5 שניות שמרוויחה זמן',\n   desc:'פעולה אקטיבית של עצירה למשך 3 עד 5 שניות, מיד כשמזהים נורת אזהרה גופנית. היא לא פותרת את הבעיה, אלא רק מרוויחה זמן למוח המבוקר לפעול.'},\n  {id:'think', name:'מצלמת האבטחה (Think)',\n   short:'מפריד בין עובדות יבשות לפרשנות רגשית',\n   desc:'כלי להפרדת עובדות יבשות מפרשנות רגשית. עובדה היא מידע אובייקטיבי שכולם יסכימו עליו, ופרשנות היא הסיפור שהמוח האוטומטי מספר מתוך פחד או כעס.'},\n  {id:'scale', name:'סולם גודל הבעיה',\n   short:'קובע גודל לפי זמן תיקון ומעורבות מבוגר',\n   desc:'כלי שמודד את הבעיה מ-1 עד 5. גודל הבעיה נקבע אך ורק לפי שני מדדים: זמן התיקון ורמת מעורבות המבוגר הנדרשת. הוא לעולם אינו נקבע לפי מידת העצבים שהבעיה מעוררת.'},\n  {id:'price', name:'כרטיס המחיר (Do)',\n   short:'כמות האנרגיה שמוציאים בתגובה',\n   desc:'כמות האנרגיה שמוציאים בתגובה. היא חייבת להיות שווה או קטנה מגודל הבעיה, כי תגובה חזקה מדי לבעיה קטנה יוצרת בעיה חדשה.'},\n  {id:'define', name:'מסננת ה-Define',\n   short:'משפט עובדתי קצר: המצב כרגע והצורך המיידי',\n   desc:'כלי לניסוח הבעיה במשפט עובדתי קצר אחד בעל שני חלקים בלבד: המצב כרגע והצורך המיידי. בלי רגשות, ניחושים או האשמות.'},\n  {id:'explore', name:'מניפת 3 הנתיבים (Explore)',\n   short:'פתרונות בשלושה כיוונים, בלי לפסול רעיונות',\n   desc:'העלאת פתרונות בשלושה כיוונים: תקשורת, גמישות עצמית, ועזרה או השהיה. בשלב הזה משהים לגמרי את השיפוטיות ולעולם לא פוסלים רעיונות.'},\n  {id:'anticipate', name:'משקפי חיזוי העתיד (Anticipate)',\n   short:'שוקל רווח מול מחיר לפני הפעולה',\n const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
